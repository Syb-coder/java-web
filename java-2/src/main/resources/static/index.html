<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日一图收藏夹</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 20px;
            color: #eee;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 {
            text-align: center; margin-bottom: 24px; font-size: 2.2rem;
            background: linear-gradient(90deg, #e94560, #f5a623);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .card {
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px; padding: 24px; margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }
        .hero { text-align: center; }
        .hero img {
            max-width: 100%; border-radius: 12px; margin: 16px 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .hero h2 { font-size: 1.6rem; margin: 12px 0 8px; color: #fff; }
        .hero p { color: #aaa; font-size: 14px; line-height: 1.6; max-width: 700px; margin: 0 auto; }
        .hero-date { color: #e94560; font-size: 13px; font-weight: 600; }
        .actions { display: flex; gap: 10px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
        button {
            padding: 10px 20px; border: none; border-radius: 24px; cursor: pointer;
            font-size: 14px; font-weight: 600; transition: all .2s;
        }
        .btn-like { background: #e94560; color: #fff; }
        .btn-like:hover { background: #c73652; transform: translateY(-2px); }
        .btn-fav { background: #f5a623; color: #fff; }
        .btn-fav:hover { background: #d8901c; transform: translateY(-2px); }
        .btn-fav.active { background: #fff; color: #f5a623; }
        .btn-refresh { background: rgba(255,255,255,0.15); color: #fff; }
        .btn-refresh:hover { background: rgba(255,255,255,0.25); }
        .btn-del { background: rgba(231,76,60,0.3); color: #fff; }
        .btn-del:hover { background: rgba(231,76,60,0.6); }
        .likes-count {
            display: inline-block; margin-left: 8px; padding: 2px 10px;
            background: rgba(255,255,255,0.15); border-radius: 12px; font-size: 12px;
        }
        .section-title {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 16px;
        }
        .section-title h3 { font-size: 1.2rem; color: #fff; }
        .grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        .pic-card {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; overflow: hidden; transition: all .2s;
        }
        .pic-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
        .pic-card img { width: 100%; height: 180px; object-fit: cover; display: block; }
        .pic-card .info { padding: 14px; }
        .pic-card .title { font-weight: 600; color: #fff; margin-bottom: 4px; }
        .pic-card .meta { font-size: 12px; color: #888; }
        .pic-card .desc { font-size: 12px; color: #aaa; margin: 8px 0; line-height: 1.5;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .pic-card .ops { display: flex; gap: 8px; margin-top: 10px; }
        .pic-card .ops button { padding: 6px 14px; font-size: 12px; }
        .empty { text-align: center; color: #666; padding: 40px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
        .tab {
            padding: 8px 20px; border-radius: 20px; cursor: pointer; font-size: 14px;
            background: rgba(255,255,255,0.1); color: #ccc; transition: all .2s;
        }
        .tab.active { background: #e94560; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>每日一图收藏夹</h1>

        <div class="card hero" id="hero">
            <div class="hero-date" id="hero-date">加载中...</div>
            <h2 id="hero-title">...</h2>
            <img id="hero-img" src="" alt="每日一图" style="display:none;">
            <p id="hero-desc"></p>
            <div class="actions">
                <button class="btn-like" onclick="likeHero()">
                    喜欢 <span class="likes-count" id="hero-likes">0</span>
                </button>
                <button class="btn-fav" id="hero-fav-btn" onclick="favHero()">收藏</button>
                <button class="btn-refresh" onclick="refresh()">换一张</button>
            </div>
        </div>

        <div class="card">
            <div class="tabs">
                <div class="tab active" data-tab="favorites" onclick="switchTab('favorites')">我的收藏</div>
                <div class="tab" data-tab="all" onclick="switchTab('all')">全部图片</div>
            </div>
            <div class="grid" id="grid">
                <div class="empty">加载中...</div>
            </div>
        </div>
    </div>

    <script>
        const API = '/api/pictures';
        let currentHero = null;
        let currentTab = 'favorites';

        async function loadHero() {
            const res = await fetch(`${API}/today`);
            currentHero = await res.json();
            renderHero();
        }

        async function refresh() {
            const res = await fetch(`${API}/random`);
            currentHero = await res.json();
            renderHero();
        }

        function renderHero() {
            const p = currentHero;
            document.getElementById('hero-date').textContent = '今日一图 · ' + (p.pictureDate || '');
            document.getElementById('hero-title').textContent = p.title;
            const img = document.getElementById('hero-img');
            img.src = p.imageUrl;
            img.style.display = 'block';
            document.getElementById('hero-desc').textContent = p.explanation;
            document.getElementById('hero-likes').textContent = p.likes;
            const favBtn = document.getElementById('hero-fav-btn');
            favBtn.classList.toggle('active', p.favorited);
            favBtn.textContent = p.favorited ? '已收藏' : '收藏';
        }

        async function likeHero() {
            if (!currentHero) return;
            const res = await fetch(`${API}/${currentHero.id}/like`, {method: 'PATCH'});
            currentHero = await res.json();
            renderHero();
            loadGrid();
        }

        async function favHero() {
            if (!currentHero) return;
            const res = await fetch(`${API}/${currentHero.id}/favorite`, {method: 'PATCH'});
            currentHero = await res.json();
            renderHero();
            loadGrid();
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
            loadGrid();
        }

        async function loadGrid() {
            const url = currentTab === 'favorites' ? `${API}/favorites` : API;
            const res = await fetch(url);
            const list = await res.json();
            const grid = document.getElementById('grid');
            if (list.length === 0) {
                grid.innerHTML = `<div class="empty">${currentTab === 'favorites' ? '还没有收藏，去上方点个收藏吧！' : '暂无图片'}</div>`;
                return;
            }
            grid.innerHTML = list.map(p => `
                <div class="pic-card">
                    <img src="${p.imageUrl}" alt="${escapeHtml(p.title)}" loading="lazy">
                    <div class="info">
                        <div class="title">${escapeHtml(p.title)}</div>
                        <div class="meta">${p.pictureDate || ''} · ${p.likes} 喜欢</div>
                        <div class="desc">${escapeHtml(p.explanation || '')}</div>
                        <div class="ops">
                            <button class="btn-like" onclick="likePic(${p.id}, this)">喜欢 ${p.likes}</button>
                            <button class="btn-fav ${p.favorited ? 'active' : ''}" onclick="favPic(${p.id}, this)">
                                ${p.favorited ? '已收藏' : '收藏'}
                            </button>
                            <button class="btn-del" onclick="delPic(${p.id})">删除</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function likePic(id, btn) {
            const res = await fetch(`${API}/${id}/like`, {method: 'PATCH'});
            const updated = await res.json();
            if (currentHero && currentHero.id === id) { currentHero = updated; renderHero(); }
            loadGrid();
        }

        async function favPic(id, btn) {
            const res = await fetch(`${API}/${id}/favorite`, {method: 'PATCH'});
            const updated = await res.json();
            if (currentHero && currentHero.id === id) { currentHero = updated; renderHero(); }
            loadGrid();
        }

        async function delPic(id) {
            if (!confirm('确定从收藏夹移除？')) return;
            await fetch(`${API}/${id}`, {method: 'DELETE'});
            if (currentHero && currentHero.id === id) {
                currentHero.favorited = false;
                renderHero();
            }
            loadGrid();
        }

        function escapeHtml(s) {
            return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        loadHero();
        loadGrid();
    </script>
</body>
</html>
