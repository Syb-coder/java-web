<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="560" viewBox="0 0 700 560">
  <rect width="700" height="560" fill="#FAFAFA" rx="8"/>
  <text x="350" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" font-family="SimHei">支付收银业务流程图</text>

  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#666"/>
    </marker>
  </defs>

  <!-- 创建订单 -->
  <ellipse cx="350" cy="60" rx="70" ry="22" fill="#4A90D9"/>
  <text x="350" y="66" text-anchor="middle" font-size="14" fill="#FFF" font-family="SimHei">创建支付订单</text>

  <line x1="350" y1="82" x2="350" y2="105" stroke="#666" stroke-width="2" marker-end="url(#arr3)"/>

  <!-- 校验用户 -->
  <rect x="260" y="110" width="180" height="40" fill="#5CB85C" rx="5"/>
  <text x="350" y="135" text-anchor="middle" font-size="13" fill="#FFF" font-family="SimHei">校验用户状态/商户状态</text>

  <line x1="350" y1="150" x2="350" y2="175" stroke="#666" stroke-width="2" marker-end="url(#arr3)"/>

  <!-- 解析渠道 -->
  <rect x="260" y="180" width="180" height="40" fill="#5CB85C" rx="5"/>
  <text x="350" y="205" text-anchor="middle" font-size="13" fill="#FFF" font-family="SimHei">解析支付渠道(ALIPAY/WECHAT/BANK)</text>

  <line x1="350" y1="220" x2="350" y2="245" stroke="#666" stroke-width="2" marker-end="url(#arr3)"/>

  <!-- 生成PENDING订单 -->
  <rect x="260" y="250" width="180" height="40" fill="#5CB85C" rx="5"/>
  <text x="350" y="275" text-anchor="middle" font-size="13" fill="#FFF" font-family="SimHei">生成PENDING状态订单</text>

  <line x1="350" y1="290" x2="350" y2="315" stroke="#666" stroke-width="2" marker-end="url(#arr3)"/>

  <!-- 确认支付 -->
  <polygon points="350,320 440,355 350,390 260,355" fill="#F0AD4E"/>
  <text x="350" y="352" text-anchor="middle" font-size="12" fill="#FFF" font-family="SimHei">确认支付？</text>

  <line x1="440" y1="355" x2="530" y2="355" stroke="#666" stroke-width="2" marker-end="url(#arr3)"/>
  <text x="465" y="348" font-size="11" fill="#C00" font-family="SimHei">否</text>
  <rect x="530" y="338" width="100" height="35" fill="#F44336" rx="5"/>
  <text x="580" y="360" text-anchor="middle" font-size="12" fill="#FFF" font-family="SimHei">订单超时</text>

  <line x1="350" y1="390" x2="350" y2="415" stroke="#666" stroke-width="2" marker-end="url(#arr3)"/>
  <text x="365" y="408" font-size="11" fill="#090" font-family="SimHei">是</text>

  <!-- 扣款 -->
  <rect x="240" y="420" width="220" height="40" fill="#5CB85C" rx="5"/>
  <text x="350" y="445" text-anchor="middle" font-size="13" fill="#FFF" font-family="SimHei">扣减余额/商户收款/记录流水</text>

  <line x1="350" y1="460" x2="350" y2="485" stroke="#666" stroke-width="2" marker-end="url(#arr3)"/>

  <!-- 风控+完成 -->
  <rect x="240" y="490" width="220" height="40" fill="#F0AD4E" rx="5"/>
  <text x="350" y="515" text-anchor="middle" font-size="13" fill="#FFF" font-family="SimHei">触发风控/订单置PAID</text>

  <line x1="350" y1="530" x2="350" y2="548" stroke="#666" stroke-width="2" marker-end="url(#arr3)"/>

  <ellipse cx="350" cy="555" rx="50" ry="8" fill="#4A90D9"/>
  <text x="350" y="559" text-anchor="middle" font-size="11" fill="#FFF" font-family="SimHei">完成</text>
</svg>