<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="100%" stop-color="#357ABD"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5CB85C"/>
      <stop offset="100%" stop-color="#449D44"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0AD4E"/>
      <stop offset="100%" stop-color="#EC971F"/>
    </linearGradient>
  </defs>
  <rect width="800" height="520" fill="#FAFAFA" rx="8"/>

  <!-- 标题 -->
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" font-family="SimHei">金融理财支付平台系统架构</text>

  <!-- 表现层 -->
  <rect x="50" y="55" width="700" height="100" fill="url(#g1)" rx="8" opacity="0.9"/>
  <text x="400" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFF" font-family="SimHei">表现层（Presentation Layer）</text>
  <rect x="80" y="95" width="140" height="45" fill="#FFF" rx="5" opacity="0.9"/>
  <text x="150" y="123" text-anchor="middle" font-size="13" fill="#333" font-family="SimHei">C端用户页面</text>
  <rect x="240" y="95" width="140" height="45" fill="#FFF" rx="5" opacity="0.9"/>
  <text x="310" y="123" text-anchor="middle" font-size="13" fill="#333" font-family="SimHei">商户管理页面</text>
  <rect x="400" y="95" width="140" height="45" fill="#FFF" rx="5" opacity="0.9"/>
  <text x="470" y="123" text-anchor="middle" font-size="13" fill="#333" font-family="SimHei">运营后台页面</text>
  <rect x="560" y="95" width="140" height="45" fill="#FFF" rx="5" opacity="0.9"/>
  <text x="630" y="123" text-anchor="middle" font-size="13" fill="#333" font-family="SimHei">风控管理页面</text>

  <!-- 箭头 -->
  <line x1="400" y1="160" x2="400" y2="185" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="178" font-size="11" fill="#666" font-family="SimHei">HTTP/REST</text>

  <!-- 业务层 -->
  <rect x="50" y="190" width="700" height="160" fill="url(#g2)" rx="8" opacity="0.9"/>
  <text x="400" y="215" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFF" font-family="SimHei">业务逻辑层（Business Layer）</text>

  <rect x="70" y="230" width="120" height="50" fill="#FFF" rx="5" opacity="0.9"/>
  <text x="130" y="250" text-anchor="middle" font-size="12" fill="#333" font-family="SimHei">AuthService</text>
  <text x="130" y="268" text-anchor="middle" font-size="11" fill="#666" font-family="SimHei">统一认证</text>

  <rect x="200" y="230" width="120" height="50" fill="#FFF" rx="5" opacity="0.9"/>
  <text x="260" y="250" text-anchor="middle" font-size="12" fill="#333" font-family="SimHei">ProductService</text>
  <text x="260" y="268" text-anchor="middle" font-size="11" fill="#666" font-family="SimHei">理财产品</text>

  <rect x="330" y="230" width="120" height="50" fill="#FFF" rx="5" opacity="0.9"/>
  <text x="390" y="250" text-anchor="middle" font-size="12" fill="#333" font-family="SimHei">InvestmentService</text>
  <text x="390" y="268" text-anchor="middle" font-size="11" fill="#666" font-family="SimHei">投资申购</text>

  <rect x="460" y="230" width="120" height="50" fill="#FFF" rx="5" opacity="0.9"/>
  <text x="520" y="250" text-anchor="middle" font-size="12" fill="#333" font-family="SimHei">PaymentService</text>
  <text x="520" y="268" text-anchor="middle" font-size="11" fill="#666" font-family="SimHei">支付收银</text>

  <rect x="590" y="230" width="120" height="50" fill="#FFF" rx="5" opacity="0.9"/>
  <text x="650" y="250" text-anchor="middle" font-size="12" fill="#333" font-family="SimHei">RiskService</text>
  <text x="650" y="268" text-anchor="middle" font-size="11" fill="#666" font-family="SimHei">风控引擎</text>

  <rect x="135" y="295" width="120" height="45" fill="#FFF" rx="5" opacity="0.9"/>
  <text x="195" y="322" text-anchor="middle" font-size="12" fill="#333" font-family="SimHei">MerchantService</text>

  <rect x="265" y="295" width="120" height="45" fill="#FFF" rx="5" opacity="0.9"/>
  <text x="325" y="322" text-anchor="middle" font-size="12" fill="#333" font-family="SimHei">TicketService</text>

  <rect x="395" y="295" width="120" height="45" fill="#FFF" rx="5" opacity="0.9"/>
  <text x="455" y="322" text-anchor="middle" font-size="12" fill="#333" font-family="SimHei">ActivityService</text>

  <rect x="525" y="295" width="120" height="45" fill="#FFF" rx="5" opacity="0.9"/>
  <text x="585" y="322" text-anchor="middle" font-size="12" fill="#333" font-family="SimHei">StatsService</text>

  <!-- 箭头 -->
  <line x1="400" y1="355" x2="400" y2="380" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="373" font-size="11" fill="#666" font-family="SimHei">JPA/Hibernate</text>

  <!-- 数据层 -->
  <rect x="50" y="385" width="700" height="100" fill="url(#g3)" rx="8" opacity="0.9"/>
  <text x="400" y="410" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFF" font-family="SimHei">数据持久层（Data Layer）</text>

  <rect x="100" y="425" width="130" height="45" fill="#FFF" rx="5" opacity="0.9"/>
  <text x="165" y="453" text-anchor="middle" font-size="13" fill="#333" font-family="SimHei">H2 数据库</text>

  <rect x="250" y="425" width="130" height="45" fill="#FFF" rx="5" opacity="0.9"/>
  <text x="315" y="453" text-anchor="middle" font-size="13" fill="#333" font-family="SimHei">Spring Data JPA</text>

  <rect x="400" y="425" width="130" height="45" fill="#FFF" rx="5" opacity="0.9"/>
  <text x="465" y="453" text-anchor="middle" font-size="13" fill="#333" font-family="SimHei">Repository接口</text>

  <rect x="550" y="425" width="130" height="45" fill="#FFF" rx="5" opacity="0.9"/>
  <text x="615" y="453" text-anchor="middle" font-size="13" fill="#333" font-family="SimHei">H2 Console</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#666"/>
    </marker>
  </defs>
</svg>