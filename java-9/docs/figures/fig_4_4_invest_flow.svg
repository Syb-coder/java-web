<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="620" viewBox="0 0 700 620">
  <rect width="700" height="620" fill="#FAFAFA" rx="8"/>
  <text x="350" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" font-family="SimHei">理财投资业务流程图</text>

  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#666"/>
    </marker>
  </defs>

  <!-- 开始 -->
  <ellipse cx="350" cy="60" rx="60" ry="22" fill="#4A90D9"/>
  <text x="350" y="66" text-anchor="middle" font-size="14" fill="#FFF" font-family="SimHei">用户发起投资</text>

  <line x1="350" y1="82" x2="350" y2="105" stroke="#666" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- 查找产品 -->
  <rect x="270" y="110" width="160" height="40" fill="#5CB85C" rx="5"/>
  <text x="350" y="135" text-anchor="middle" font-size="13" fill="#FFF" font-family="SimHei">查找理财产品</text>

  <line x1="350" y1="150" x2="350" y2="175" stroke="#666" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- 判断产品状态 -->
  <polygon points="350,180 440,215 350,250 260,215" fill="#F0AD4E"/>
  <text x="350" y="212" text-anchor="middle" font-size="12" fill="#FFF" font-family="SimHei">产品在售？</text>

  <line x1="260" y1="215" x2="180" y2="215" stroke="#666" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="195" y="208" font-size="11" fill="#C00" font-family="SimHei">否</text>
  <rect x="80" y="198" width="100" height="35" fill="#F44336" rx="5"/>
  <text x="130" y="220" text-anchor="middle" font-size="12" fill="#FFF" font-family="SimHei">返回错误</text>

  <line x1="350" y1="250" x2="350" y2="275" stroke="#666" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="365" y="268" font-size="11" fill="#090" font-family="SimHei">是</text>

  <!-- 判断金额 -->
  <polygon points="350,280 450,320 350,360 250,320" fill="#F0AD4E"/>
  <text x="350" y="316" text-anchor="middle" font-size="12" fill="#FFF" font-family="SimHei">金额≥起投？</text>

  <line x1="250" y1="320" x2="180" y2="320" stroke="#666" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="195" y="313" font-size="11" fill="#C00" font-family="SimHei">否</text>
  <rect x="80" y="303" width="100" height="35" fill="#F44336" rx="5"/>
  <text x="130" y="325" text-anchor="middle" font-size="12" fill="#FFF" font-family="SimHei">金额不足</text>

  <line x1="350" y1="360" x2="350" y2="385" stroke="#666" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="365" y="378" font-size="11" fill="#090" font-family="SimHei">是</text>

  <!-- 判断余额 -->
  <polygon points="350,390 450,425 350,460 250,425" fill="#F0AD4E"/>
  <text x="350" y="422" text-anchor="middle" font-size="12" fill="#FFF" font-family="SimHei">余额充足？</text>

  <line x1="250" y1="425" x2="180" y2="425" stroke="#666" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="195" y="418" font-size="11" fill="#C00" font-family="SimHei">否</text>
  <rect x="80" y="408" width="100" height="35" fill="#F44336" rx="5"/>
  <text x="130" y="430" text-anchor="middle" font-size="12" fill="#FFF" font-family="SimHei">余额不足</text>

  <line x1="350" y1="460" x2="350" y2="485" stroke="#666" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="365" y="478" font-size="11" fill="#090" font-family="SimHei">是</text>

  <!-- 执行投资 -->
  <rect x="240" y="490" width="220" height="40" fill="#5CB85C" rx="5"/>
  <text x="350" y="515" text-anchor="middle" font-size="13" fill="#FFF" font-family="SimHei">扣减余额/创建订单/记录流水</text>

  <line x1="350" y1="530" x2="350" y2="555" stroke="#666" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- 触发风控 -->
  <rect x="240" y="560" width="220" height="40" fill="#F0AD4E" rx="5"/>
  <text x="350" y="585" text-anchor="middle" font-size="13" fill="#FFF" font-family="SimHei">触发风控检查/返回订单</text>
</svg>