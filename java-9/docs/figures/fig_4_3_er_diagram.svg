<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#FAFAFA" rx="8"/>
  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" font-family="SimHei">数据库实体关系图（ER Diagram）</text>

  <!-- User实体 -->
  <rect x="20" y="50" width="170" height="130" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2" rx="4"/>
  <rect x="20" y="50" width="170" height="28" fill="#4CAF50" rx="4"/>
  <text x="105" y="69" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFF" font-family="SimHei">users（用户）</text>
  <text x="30" y="95" font-size="11" fill="#333" font-family="SimHei">PK id (BIGINT)</text>
  <text x="30" y="110" font-size="11" fill="#333" font-family="SimHei">username (VARCHAR 50)</text>
  <text x="30" y="125" font-size="11" fill="#333" font-family="SimHei">password (VARCHAR 100)</text>
  <text x="30" y="140" font-size="11" fill="#333" font-family="SimHei">balance (DECIMAL 18,2)</text>
  <text x="30" y="155" font-size="11" fill="#333" font-family="SimHei">verified (BOOLEAN)</text>
  <text x="30" y="170" font-size="11" fill="#333" font-family="SimHei">status (VARCHAR 20)</text>

  <!-- FinancialProduct实体 -->
  <rect x="310" y="50" width="180" height="130" fill="#E3F2FD" stroke="#2196F3" stroke-width="2" rx="4"/>
  <rect x="310" y="50" width="180" height="28" fill="#2196F3" rx="4"/>
  <text x="400" y="69" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFF" font-family="SimHei">financial_products</text>
  <text x="320" y="95" font-size="11" fill="#333" font-family="SimHei">PK id (BIGINT)</text>
  <text x="320" y="110" font-size="11" fill="#333" font-family="SimHei">name (VARCHAR 100)</text>
  <text x="320" y="125" font-size="11" fill="#333" font-family="SimHei">annualRate (DECIMAL 6,4)</text>
  <text x="320" y="140" font-size="11" fill="#333" font-family="SimHei">minAmount (DECIMAL 18,2)</text>
  <text x="320" y="155" font-size="11" fill="#333" font-family="SimHei">riskLevel (INT)</text>
  <text x="320" y="170" font-size="11" fill="#333" font-family="SimHei">status (VARCHAR 20)</text>

  <!-- InvestmentOrder实体 -->
  <rect x="610" y="50" width="170" height="130" fill="#FFF3E0" stroke="#FF9800" stroke-width="2" rx="4"/>
  <rect x="610" y="50" width="170" height="28" fill="#FF9800" rx="4"/>
  <text x="695" y="69" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFF" font-family="SimHei">investment_orders</text>
  <text x="620" y="95" font-size="11" fill="#333" font-family="SimHei">PK id (BIGINT)</text>
  <text x="620" y="110" font-size="11" fill="#333" font-family="SimHei">orderNo (VARCHAR 32)</text>
  <text x="620" y="125" font-size="11" fill="#333" font-family="SimHei">FK userId (BIGINT)</text>
  <text x="620" y="140" font-size="11" fill="#333" font-family="SimHei">FK productId (BIGINT)</text>
  <text x="620" y="155" font-size="11" fill="#333" font-family="SimHei">amount (DECIMAL 18,2)</text>
  <text x="620" y="170" font-size="11" fill="#333" font-family="SimHei">expectedReturn (DECIMAL)</text>

  <!-- Merchant实体 -->
  <rect x="20" y="220" width="170" height="120" fill="#F3E5F5" stroke="#9C27B0" stroke-width="2" rx="4"/>
  <rect x="20" y="220" width="170" height="28" fill="#9C27B0" rx="4"/>
  <text x="105" y="239" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFF" font-family="SimHei">merchants（商户）</text>
  <text x="30" y="265" font-size="11" fill="#333" font-family="SimHei">PK id (BIGINT)</text>
  <text x="30" y="280" font-size="11" fill="#333" font-family="SimHei">username (VARCHAR 50)</text>
  <text x="30" y="295" font-size="11" fill="#333" font-family="SimHei">merchantName (VARCHAR)</text>
  <text x="30" y="310" font-size="11" fill="#333" font-family="SimHei">balance (DECIMAL 18,2)</text>
  <text x="30" y="325" font-size="11" fill="#333" font-family="SimHei">licenseNo (VARCHAR)</text>

  <!-- PaymentOrder实体 -->
  <rect x="310" y="220" width="180" height="120" fill="#FCE4EC" stroke="#E91E63" stroke-width="2" rx="4"/>
  <rect x="310" y="220" width="180" height="28" fill="#E91E63" rx="4"/>
  <text x="400" y="239" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFF" font-family="SimHei">payment_orders</text>
  <text x="320" y="265" font-size="11" fill="#333" font-family="SimHei">PK id (BIGINT)</text>
  <text x="320" y="280" font-size="11" fill="#333" font-family="SimHei">orderNo (VARCHAR 32)</text>
  <text x="320" y="295" font-size="11" fill="#333" font-family="SimHei">FK userId (BIGINT)</text>
  <text x="320" y="310" font-size="11" fill="#333" font-family="SimHei">FK merchantId (BIGINT)</text>
  <text x="320" y="325" font-size="11" fill="#333" font-family="SimHei">channel/status (VARCHAR)</text>

  <!-- Transaction实体 -->
  <rect x="610" y="220" width="170" height="120" fill="#E0F2F1" stroke="#009688" stroke-width="2" rx="4"/>
  <rect x="610" y="220" width="170" height="28" fill="#009688" rx="4"/>
  <text x="695" y="239" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFF" font-family="SimHei">transactions</text>
  <text x="620" y="265" font-size="11" fill="#333" font-family="SimHei">PK id (BIGINT)</text>
  <text x="620" y="280" font-size="11" fill="#333" font-family="SimHei">transactionNo (VARCHAR)</text>
  <text x="620" y="295" font-size="11" fill="#333" font-family="SimHei">accountId/type</text>
  <text x="620" y="310" font-size="11" fill="#333" font-family="SimHei">amount (DECIMAL)</text>
  <text x="620" y="325" font-size="11" fill="#333" font-family="SimHei">balanceAfter (DECIMAL)</text>

  <!-- RiskRecord实体 -->
  <rect x="120" y="380" width="170" height="110" fill="#FFEBEE" stroke="#F44336" stroke-width="2" rx="4"/>
  <rect x="120" y="380" width="170" height="28" fill="#F44336" rx="4"/>
  <text x="205" y="399" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFF" font-family="SimHei">risk_records</text>
  <text x="130" y="425" font-size="11" fill="#333" font-family="SimHei">PK id (BIGINT)</text>
  <text x="130" y="440" font-size="11" fill="#333" font-family="SimHei">targetType/targetId</text>
  <text x="130" y="455" font-size="11" fill="#333" font-family="SimHei">riskType/riskLevel</text>
  <text x="130" y="470" font-size="11" fill="#333" font-family="SimHei">status (VARCHAR 20)</text>

  <!-- SupportTicket实体 -->
  <rect x="340" y="380" width="170" height="110" fill="#E8EAF6" stroke="#3F51B5" stroke-width="2" rx="4"/>
  <rect x="340" y="380" width="170" height="28" fill="#3F51B5" rx="4"/>
  <text x="425" y="399" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFF" font-family="SimHei">support_tickets</text>
  <text x="350" y="425" font-size="11" fill="#333" font-family="SimHei">PK id (BIGINT)</text>
  <text x="350" y="440" font-size="11" fill="#333" font-family="SimHei">FK userId (BIGINT)</text>
  <text x="350" y="455" font-size="11" fill="#333" font-family="SimHei">title/description</text>
  <text x="350" y="470" font-size="11" fill="#333" font-family="SimHei">status/reply</text>

  <!-- Activity实体 -->
  <rect x="560" y="380" width="170" height="110" fill="#FFF8E1" stroke="#FFC107" stroke-width="2" rx="4"/>
  <rect x="560" y="380" width="170" height="28" fill="#FFC107" rx="4"/>
  <text x="645" y="399" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFF" font-family="SimHei">activities</text>
  <text x="570" y="425" font-size="11" fill="#333" font-family="SimHei">PK id (BIGINT)</text>
  <text x="570" y="440" font-size="11" fill="#333" font-family="SimHei">title/type</text>
  <text x="570" y="455" font-size="11" fill="#333" font-family="SimHei">startTime/endTime</text>
  <text x="570" y="470" font-size="11" fill="#333" font-family="SimHei">active (BOOLEAN)</text>

  <!-- 关系线 -->
  <line x1="190" y1="115" x2="310" y2="115" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="250" y="108" text-anchor="middle" font-size="10" fill="#666" font-family="SimHei">1:N</text>

  <line x1="490" y1="115" x2="610" y2="115" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="550" y="108" text-anchor="middle" font-size="10" fill="#666" font-family="SimHei">1:N</text>

  <line x1="105" y1="180" x2="105" y2="220" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="115" y="205" font-size="10" fill="#666" font-family="SimHei">1:N</text>

  <line x1="190" y1="260" x2="310" y2="260" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="250" y="253" text-anchor="middle" font-size="10" fill="#666" font-family="SimHei">1:N</text>

  <line x1="490" y1="260" x2="610" y2="260" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="550" y="253" text-anchor="middle" font-size="10" fill="#666" font-family="SimHei">1:N</text>

  <line x1="105" y1="340" x2="205" y2="380" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3"/>

  <line x1="400" y1="340" x2="425" y2="380" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3"/>

  <text x="400" y="540" text-anchor="middle" font-size="12" fill="#888" font-family="SimHei">虚线表示实体间关联关系（1:N = 一对多）</text>
</svg>