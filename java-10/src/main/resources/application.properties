# ============================================================
# 数据源配置：H2 文件模式，保证数据落盘持久化
# 为什么用 file 模式而非 mem 模式：文件模式将数据写入磁盘，重启后数据不丢失
# AUTO_SERVER=TRUE 允许多个进程同时访问同一个数据库文件（避免文件锁冲突）
# ============================================================
spring.datasource.url=jdbc:h2:file:./data/financedb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ============================================================
# JPA / Hibernate 配置
# ddl-auto=update：启动时自动建表/更新表结构，开发阶段便利
# show-sql=true：控制台打印 SQL 语句，便于调试和排查问题
# format_sql=true：格式化 SQL 输出，提升可读性
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# H2 Web 控制台：提供浏览器访问数据库的能力
# 路径 /h2-console 可在运行时查看表结构与数据
# ============================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# 服务端口：前端 Vite 开发服务器默认在 5173，后端使用 8080 避免冲突
# ============================================================
server.port=8080
