# 应用名称：本服务在 Spring Boot 启动时的标识，用于日志、监控等场景
spring.application.name=java-6

# ===== H2 数据库配置（文件模式，持久化） =====
# 数据落盘到 java-6/data/ 目录，重启不丢数据
# JDBC 连接 URL：采用 H2 的文件模式（file:），数据持久化到 ./data/securitydb 文件
#   - DB_CLOSE_DELAY=-1：JVM 退出前不关闭数据库连接，避免连接提前释放导致异常
#   - MODE=MySQL：兼容 MySQL 方言，便于后续切换到 MySQL 数据库
spring.datasource.url=jdbc:h2:file:./data/securitydb;DB_CLOSE_DELAY=-1;MODE=MySQL
# JDBC 驱动类名：H2 数据库官方驱动
spring.datasource.driver-class-name=org.h2.Driver
# 数据库用户名：sa 为 H2 默认管理员账户
spring.datasource.username=sa
# 数据库密码：留空表示无密码（仅用于开发/演示环境，生产环境必须设置强密码）
spring.datasource.password=

# ===== JPA / Hibernate =====
# 数据库方言：指定使用 H2 方言，让 Hibernate 生成兼容 H2 的 SQL 语句
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# DDL 自动维护策略：update 表示根据 Entity 实体类自动更新表结构（不删除已有数据）
#   可选值：none（不操作）、update（更新）、create（每次重建）、create-drop（创建并退出时删除）
spring.jpa.hibernate.ddl-auto=update
# 是否在控制台打印 Hibernate 生成的 SQL 语句，便于开发调试
spring.jpa.show-sql=true

# ===== H2 Web 控制台 =====
# 启用 H2 自带的 Web 管理控制台，可通过浏览器访问数据库
spring.h2.console.enabled=true
# H2 控制台访问路径：访问地址为 http://localhost:8085/h2-console
spring.h2.console.path=/h2-console

# ===== 服务端口 =====
# 内嵌 Tomcat 监听端口：本官网运行在 8085 端口
server.port=8085
