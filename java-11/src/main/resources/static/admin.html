<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>次元社 · 管理后台</title>
    <style>
        /* ========== 设计变量 ========== */
        :root {
            --primary: #7c5cfc;
            --primary-light: #f0edff;
            --primary-dark: #5a3fd6;
            --accent: #ff6b9d;
            --bg: #ffffff;
            --bg2: #f6f5fc;
            --text: #1a1a2e;
            --muted: #6a6a85;
            --border: #e0e0ea;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 2px 12px rgba(124, 92, 252, 0.08);
            --shadow-hover: 0 6px 24px rgba(124, 92, 252, 0.15);
            --gradient: linear-gradient(135deg, #7c5cfc 0%, #ff6b9d 100%);
            --sidebar-w: 240px;
        }

        /* ========== 基础重置 ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: var(--bg2);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        a { color: var(--primary); text-decoration: none; }

        /* ========== 登录页 ========== */
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--gradient);
            padding: 20px;
        }

        .login-card {
            background: var(--bg);
            border-radius: var(--radius);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }

        .login-card h1 {
            font-size: 24px;
            text-align: center;
            margin-bottom: 8px;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-card .subtitle {
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 32px;
        }

        .form-group { margin-bottom: 20px; }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            background: var(--bg);
            transition: all 0.2s;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .form-group textarea { resize: vertical; min-height: 80px; }

        .login-hint {
            background: var(--primary-light);
            border-radius: var(--radius-sm);
            padding: 12px;
            font-size: 12px;
            color: var(--muted);
            margin-top: 20px;
            line-height: 1.8;
        }

        .login-hint code {
            background: var(--bg);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--primary);
            font-weight: 600;
        }

        /* ========== 按钮 ========== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 16px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            font-family: inherit;
        }

        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(124, 92, 252, 0.3); }
        .btn-accent { background: var(--accent); color: #fff; }
        .btn-accent:hover { background: #e85a8a; }
        .btn-success { background: var(--success); color: #fff; }
        .btn-success:hover { background: #16a34a; }
        .btn-warning { background: var(--warning); color: #fff; }
        .btn-warning:hover { background: #d97706; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-danger:hover { background: #dc2626; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
        .btn-ghost { background: transparent; color: var(--muted); padding: 6px 10px; }
        .btn-ghost:hover { color: var(--primary); background: var(--primary-light); }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        .btn-block { width: 100%; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ========== 管理后台布局 ========== */
        .admin-layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-w);
            background: var(--text);
            color: #a0a0b5;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            overflow-y: auto;
            z-index: 100;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-header h2 {
            font-size: 18px;
            font-weight: 800;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sidebar-header p {
            font-size: 12px;
            color: #6a6a85;
            margin-top: 4px;
        }

        .sidebar-nav {
            flex: 1;
            padding: 12px 0;
        }

        .nav-group-title {
            padding: 12px 20px 6px;
            font-size: 11px;
            color: #6a6a85;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            font-size: 14px;
            color: #a0a0b5;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        .nav-item.active {
            background: rgba(124, 92, 252, 0.15);
            color: #fff;
            border-left-color: var(--primary);
        }

        .nav-item .icon {
            width: 18px;
            text-align: center;
            font-size: 16px;
        }

        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 12px;
            color: #6a6a85;
        }

        /* ========== 主内容区 ========== */
        .main-area {
            flex: 1;
            margin-left: var(--sidebar-w);
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .topbar {
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .topbar h1 {
            font-size: 18px;
            font-weight: 700;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .admin-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .admin-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--gradient);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
        }

        .content-area {
            flex: 1;
            padding: 24px;
        }

        /* ========== 统计卡片 ========== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            transition: transform 0.2s;
        }

        .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }

        .stat-card .stat-icon {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-bottom: 12px;
        }

        .stat-card .stat-value {
            font-size: 28px;
            font-weight: 800;
            color: var(--text);
        }

        .stat-card .stat-label {
            font-size: 13px;
            color: var(--muted);
            margin-top: 4px;
        }

        /* ========== 卡片 ========== */
        .card {
            background: var(--bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            margin-bottom: 20px;
        }

        .card-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .card-header h3 {
            font-size: 16px;
            font-weight: 700;
        }

        .card-body { padding: 20px; }

        /* ========== 表格 ========== */
        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        table th,
        table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        table th {
            background: var(--bg2);
            font-weight: 600;
            color: var(--muted);
            font-size: 13px;
            position: sticky;
            top: 0;
        }

        table tbody tr:hover { background: var(--bg2); }

        table td .cell-content {
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ========== 徽章 ========== */
        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-success { background: #dcfce7; color: #16a34a; }
        .badge-warning { background: #fef3c7; color: #d97706; }
        .badge-danger { background: #fee2e2; color: #dc2626; }
        .badge-info { background: var(--primary-light); color: var(--primary); }
        .badge-muted { background: #f1f1f5; color: var(--muted); }
        .badge-accent { background: #fff0f5; color: var(--accent); }

        /* ========== 搜索栏 ========== */
        .search-bar {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .search-bar input {
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            min-width: 220px;
            font-family: inherit;
        }

        .search-bar input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        /* ========== 操作按钮组 ========== */
        .action-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        /* ========== 空状态 ========== */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.4;
        }

        /* ========== 分页 ========== */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            padding: 16px;
            border-top: 1px solid var(--border);
        }

        .pagination button {
            min-width: 32px;
            height: 32px;
            border: 1px solid var(--border);
            background: var(--bg);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            color: var(--text);
            transition: all 0.2s;
        }

        .pagination button:hover:not(:disabled) {
            border-color: var(--primary);
            color: var(--primary);
        }

        .pagination button.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }

        .pagination .page-info {
            font-size: 13px;
            color: var(--muted);
            margin: 0 8px;
        }

        /* ========== 轻提示 ========== */
        .toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text);
            color: #fff;
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            z-index: 1000;
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
        }

        .toast.show { opacity: 1; top: 90px; }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        .toast.warning { background: var(--warning); }

        /* ========== 模态框 ========== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.show { display: flex; }

        .modal {
            background: var(--bg);
            border-radius: var(--radius);
            padding: 28px;
            max-width: 560px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-hover);
        }

        .modal h3 {
            font-size: 18px;
            margin-bottom: 16px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        /* ========== 页脚 ========== */
        .footer {
            background: var(--text);
            color: #a0a0b5;
            padding: 24px 20px;
            margin-top: auto;
        }

        .footer-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .footer-brand {
            font-size: 16px;
            font-weight: 800;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .footer-bottom {
            font-size: 12px;
            color: #6a6a85;
        }

        /* ========== 简易图表 ========== */
        .chart-bars {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            height: 200px;
            padding: 16px 0;
        }

        .chart-bar {
            flex: 1;
            background: var(--primary);
            border-radius: 4px 4px 0 0;
            position: relative;
            min-height: 4px;
            transition: opacity 0.2s;
            cursor: pointer;
        }

        .chart-bar:hover { opacity: 0.8; }

        .chart-bar .bar-label {
            position: absolute;
            bottom: -24px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: var(--muted);
            white-space: nowrap;
        }

        .chart-bar .bar-value {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            font-weight: 600;
            color: var(--text);
        }

        /* ========== 加载状态 ========== */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--muted);
            font-size: 14px;
        }

        .loading::before {
            content: '⏳';
            display: block;
            font-size: 32px;
            margin-bottom: 8px;
            animation: spin 1.5s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ========== 响应式 ========== */
        .mobile-toggle {
            display: none;
            background: transparent;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--text);
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s;
            }
            .sidebar.show { transform: translateX(0); }
            .main-area { margin-left: 0; }
            .mobile-toggle { display: block; }
            .content-area { padding: 16px; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

<!-- 登录页 -->
<div id="loginPage" class="login-page" style="display:none;">
    <div class="login-card">
        <h1>🌸 次元社管理后台</h1>
        <p class="subtitle">管理员登录</p>
        <form id="loginForm" onsubmit="return false;">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="loginUsername" placeholder="请输入管理员用户名" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="loginPassword" placeholder="请输入密码" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="loginBtn" onclick="handleLogin()">登录</button>
        </form>
        <div class="login-hint">
            🔑 默认账号：<br>
            管理员：<code>admin</code> / <code>admin123</code><br>
            版主：<code>moderator</code> / <code>mod123</code>
        </div>
    </div>
</div>

<!-- 管理后台主体 -->
<div id="adminLayout" class="admin-layout" style="display:none;">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>🌸 次元社</h2>
            <p>管理后台 Control Panel</p>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-group-title">概览</div>
            <div class="nav-item active" data-tab="dashboard" onclick="switchTab('dashboard')">
                <span class="icon">📊</span><span>仪表盘</span>
            </div>
            <div class="nav-group-title">用户与内容</div>
            <div class="nav-item" data-tab="users" onclick="switchTab('users')">
                <span class="icon">👥</span><span>用户管理</span>
            </div>
            <div class="nav-item" data-tab="posts-pending" onclick="switchTab('posts-pending')">
                <span class="icon">📝</span><span>帖子审核</span>
            </div>
            <div class="nav-item" data-tab="comments" onclick="switchTab('comments')">
                <span class="icon">💬</span><span>评论管理</span>
            </div>
            <div class="nav-item" data-tab="reports" onclick="switchTab('reports')">
                <span class="icon">🚩</span><span>举报处理</span>
            </div>
            <div class="nav-group-title">社区治理</div>
            <div class="nav-item" data-tab="sections" onclick="switchTab('sections')">
                <span class="icon">📁</span><span>板块管理</span>
            </div>
            <div class="nav-item" data-tab="sensitive-words" onclick="switchTab('sensitive-words')">
                <span class="icon">🚫</span><span>敏感词</span>
            </div>
            <div class="nav-group-title">数据与系统</div>
            <div class="nav-item" data-tab="stats" onclick="switchTab('stats')">
                <span class="icon">📈</span><span>数据统计</span>
            </div>
            <div class="nav-item" data-tab="logs" onclick="switchTab('logs')">
                <span class="icon">📋</span><span>操作日志</span>
            </div>
            <div class="nav-item" data-tab="configs" onclick="switchTab('configs')">
                <span class="icon">⚙️</span><span>系统配置</span>
            </div>
        </nav>
        <div class="sidebar-footer">
            v1.0 · © 2026 次元社
        </div>
    </aside>

    <!-- 主区域 -->
    <div class="main-area">
        <header class="topbar">
            <button class="mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('show')">☰</button>
            <h1 id="pageTitle">仪表盘</h1>
            <div class="topbar-right">
                <div class="admin-info">
                    <div class="admin-avatar" id="adminAvatar">A</div>
                    <span id="adminName">管理员</span>
                </div>
                <button class="btn btn-outline btn-sm" onclick="handleLogout()">退出登录</button>
            </div>
        </header>

        <main class="content-area" id="contentArea">
            <!-- 动态内容 -->
        </main>

        <!-- 页脚 -->
        <footer class="footer">
            <div class="footer-inner">
                <div class="footer-brand">🌸 次元社 · 管理后台</div>
                <div class="footer-bottom">© 2026 次元社 ACG Community · 仅供学习交流使用 · Powered by Spring Boot</div>
            </div>
        </footer>
    </div>
</div>

<!-- 轻提示 -->
<div class="toast" id="toast"></div>

<!-- 模态框 -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
    <div class="modal" id="modalContent"></div>
</div>

<script>
    // ========== API 封装 ==========
    const API_BASE = 'http://localhost:8089';

    /**
     * API 请求封装对象
     * 统一处理 fetch 请求，携带 Session 凭证，处理 401 跳转登录
     */
    const API = {
        /**
         * 发起 API 请求
         * @param {string} url - API 路径（以 /api 开头）
         * @param {object} options - fetch 配置项
         * @returns {Promise<object>} 解析后的响应 JSON
         */
        async request(url, options = {}) {
            try {
                const fetchOptions = {
                    credentials: 'include',
                    headers: {},
                    ...options
                };
                // 仅当 body 为普通对象时按 JSON 发送
                if (options.body && typeof options.body === 'object' && !(options.body instanceof FormData)) {
                    fetchOptions.headers['Content-Type'] = 'application/json';
                    fetchOptions.body = JSON.stringify(options.body);
                }
                const response = await fetch(API_BASE + url, fetchOptions);
                if (response.status === 401) {
                    state.admin = null;
                    showLogin();
                    showMsg('登录已过期，请重新登录', 'warning');
                    return { success: false, message: '未登录', data: null };
                }
                const text = await response.text();
                let data;
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    return { success: false, message: '服务器返回格式异常', data: null };
                }
                return data;
            } catch (err) {
                console.error('API请求失败:', err);
                return { success: false, message: '网络请求失败，请检查后端服务是否启动', data: null };
            }
        },

        async get(url) { return this.request(url, { method: 'GET' }); },
        async post(url, data) { return this.request(url, { method: 'POST', body: data }); },
        async put(url, data) { return this.request(url, { method: 'PUT', body: data }); },
        async del(url) { return this.request(url, { method: 'DELETE' }); }
    };

    /**
     * 构建 URL 查询参数
     * 用于后端 @RequestParam 接口
     * @param {object} params - 参数对象
     * @returns {string} 查询字符串，如 ?key1=val1&key2=val2
     */
    function buildQuery(params) {
        const parts = [];
        for (const k in params) {
            if (params[k] !== undefined && params[k] !== null && params[k] !== '') {
                parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
            }
        }
        return parts.length ? '?' + parts.join('&') : '';
    }

    /**
     * 格式化日期时间
     * @param {string|Date} date - 日期字符串或对象
     * @returns {string} 格式化后的时间字符串
     */
    function formatDate(date) {
        if (!date) return '—';
        const d = new Date(date);
        if (isNaN(d.getTime())) return '—';
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        const h = String(d.getHours()).padStart(2, '0');
        const min = String(d.getMinutes()).padStart(2, '0');
        return `${y}-${m}-${day} ${h}:${min}`;
    }

    /**
     * HTML 转义，防止 XSS 攻击
     * @param {string} str - 原始字符串
     * @returns {string} 转义后的安全字符串
     */
    function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    /**
     * 显示轻提示
     * @param {string} msg - 提示消息
     * @param {string} type - 提示类型：success/error/warning
     * @param {number} duration - 显示时长（毫秒）
     */
    function showMsg(msg, type = '', duration = 2500) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.className = 'toast show ' + type;
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => {
            toast.className = 'toast';
        }, duration);
    }

    /**
     * 确认对话框（基于模态框）
     * @param {string} msg - 确认消息

     * @param {string} title - 标题

    /**
     * 渲染分页控件
     * @param {number} total - 总条数
     * @param {number} current - 当前页
     * @param {function} onPage - 切换页回调
     * @returns {string} HTML 字符串
     */
    function renderPagination(total, current, onPage) {
        const totalPages = Math.max(1, Math.ceil(total / state.pageSize));
        if (totalPages <= 1) return '';
        let html = '<div class="pagination">';
        html += `<button onclick="${onPage}(${current - 1})" ${current <= 1 ? 'disabled' : ''}>上一页</button>`;
        // 显示页码（最多 5 个）
        let start = Math.max(1, current - 2);
        let end = Math.min(totalPages, start + 4);
        start = Math.max(1, end - 4);
        for (let i = start; i <= end; i++) {
            html += `<button class="${i === current ? 'active' : ''}" onclick="${onPage}(${i})">${i}</button>`;
        }
        html += `<button onclick="${onPage}(${current + 1})" ${current >= totalPages ? 'disabled' : ''}>下一页</button>`;
        html += `<span class="page-info">共 ${total} 条 / ${totalPages} 页</span>`;
        html += '</div>';
        return html;
    }

    /**

     * @param {string} action - resolve 或 reject
     */
    function handleReport(id, action) {
        const text = action === 'resolve' ? '处理' : '驳回';
        document.getElementById('modalContent').innerHTML = `
            <h3>${text}举报 #${id}</h3>
            <div class="form-group">

            </div>
        `;
        document.getElementById('modalOverlay').classList.add('show');
    }

    /**
     * 提交举报处理
     * @param {number} id - 举报 ID
     * @param {string} action - resolve 或 reject
     */
    async function submitReport(id, action) {
        const remark = document.getElementById('reportRemark').value.trim();
        // 后端使用 @RequestParam，通过 query string 传递
        const url = `/api/admin/reports/${id}/${action}` + buildQuery({ handleRemark: remark });
        const res = await API.put(url);
        if (res.success) {
            showMsg('操作成功', 'success');
            closeModal();
            renderReports();
        } else {
            showMsg(res.message || '操作失败', 'error');

            res = await API.post('/api/admin/sections' + query);

        if (res.success) {

            { label: '评论总量', value: s.totalComments || 0, color: 'var(--success)' }

    async function renderSensitiveWords(page) {
        if (page) state.page['sensitive-words'] = page;
        const p = state.page['sensitive-words'];
        const area = document.getElementById('contentArea');
        area.innerHTML = renderLoading();
        const res = await API.get('/api/admin/sensitive-words');
        if (!res.success) {
            area.innerHTML = `<div class="card"><div class="card-body">${escapeHtml(res.message || '加载失败')}</div></div>`;
            return;
        }
        const list = res.data || [];
        const total = list.length;
        const startIdx = (p - 1) * state.pageSize;
        const pageList = list.slice(startIdx, startIdx + state.pageSize);

        let html = `<div class="card">
            <div class="card-header">
                <h3>敏感词列表（共 ${total} 个）</h3>
                <button class="btn btn-primary btn-sm" onclick="showSensitiveWordForm()">+ 添加敏感词</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead><tr>
                        <th>ID</th><th>敏感词</th><th>分类</th><th>更新时间</th><th>操作</th>
                    </tr></thead>
                    <tbody>`;
        if (pageList.length === 0) {
            html += `<tr><td colspan="5">${renderEmpty('暂无敏感词')}</td></tr>`;
        } else {
            pageList.forEach(w => {
                html += `<tr>
                    <td>${w.id}</td>
                    <td><strong>${escapeHtml(w.word)}</strong></td>
                    <td>${w.category ? `<span class="badge badge-info">${escapeHtml(w.category)}</span>` : '—'}</td>
                    <td>${formatDate(w.updateTime)}</td>
                    <td><div class="action-group">
                        <button class="btn btn-danger btn-sm" onclick="deleteSensitiveWord(${w.id})">删除</button>
                    </div></td>
                </tr>`;
            });
        }
        html += `</tbody></table></div>`;
        html += renderPagination(total, p, 'renderSensitiveWords');
        html += `</div>`;
        area.innerHTML = html;
    }

    /**
     * 显示添加敏感词表单
     */
    function showSensitiveWordForm() {
        document.getElementById('modalContent').innerHTML = `
            <h3>添加敏感词</h3>
            <div class="form-group">
                <label>敏感词 *</label>
                <input type="text" id="wordInput" placeholder="请输入敏感词">
            </div>
            <div class="form-group">
                <label>分类</label>
                <input type="text" id="categoryInput" placeholder="如：政治、色情、广告">
            </div>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" onclick="addSensitiveWord()">添加</button>
            </div>
        `;
        document.getElementById('modalOverlay').classList.add('show');
    }

    /**
     * 添加敏感词
     */
    async function addSensitiveWord() {
        const word = document.getElementById('wordInput').value.trim();
        const category = document.getElementById('categoryInput').value.trim();
        if (!word) {
            showMsg('请输入敏感词', 'warning');
            return;
        }
        // 后端使用 @RequestParam，通过 query string 传递
        const url = '/api/admin/sensitive-words' + buildQuery({ word, category });
        const res = await API.post(url);
        if (res.success) {
            showMsg('敏感词已添加', 'success');
            closeModal();
            renderSensitiveWords(state.page['sensitive-words']);
        } else {
            showMsg(res.message || '添加失败', 'error');
        }
    }

    /**
     * 删除敏感词
     * @param {number} id - 敏感词 ID
     */
    async function deleteSensitiveWord(id) {
        confirmAction('确定要删除该敏感词吗？', async () => {
            const res = await API.del(`/api/admin/sensitive-words/${id}`);
            if (res.success) {
                showMsg('敏感词已删除', 'success');
                renderSensitiveWords(state.page['sensitive-words']);
            } else {
                showMsg(res.message || '删除失败', 'error');
            }
        });
    }

    // ========== 初始化 ==========
    /**
     * 页面入口：检查登录态后渲染
     */
    (function init() {
        // 绑定回车键登录
        document.getElementById('loginPassword').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleLogin();
        });
        document.getElementById('loginUsername').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('loginPassword').focus();
        });
        checkSession();
    })();
</script>
</body>
</html>
