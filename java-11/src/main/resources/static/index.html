                        <label class="form-label">正文</label>
                        <textarea class="form-textarea" id="postContent" placeholder="请输入帖子内容..."></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">标签（逗号分隔）</label>
                        <input type="text" class="form-input" id="postTags" placeholder="如：新番,推荐,讨论" />
                    </div>
                    <button class="btn btn-primary" id="submitPostBtn" onclick="submitPost()">发布帖子</button>
                </div>
            </div>
        `;
    }

    /**
     * 提交发帖
     */
    async function submitPost() {
        if (!checkLogin()) return;
        const sectionId = parseInt(document.getElementById('postSection').value);
        const title = document.getElementById('postTitle').value.trim();
        const content = document.getElementById('postContent').value.trim();
        const tagsStr = document.getElementById('postTags').value.trim();
        const tags = tagsStr ? tagsStr.split(/[,，]/).map(t => t.trim()).filter(t => t) : [];

        if (!sectionId) {
            showNotification('请选择板块', 'warning');
            return;
        }
        if (!title) {
            showNotification('请输入标题', 'warning');
            return;
        }
        if (!content) {
            showNotification('请输入内容', 'warning');
            return;
        }

        const btn = document.getElementById('submitPostBtn');
        btn.disabled = true;
        btn.textContent = '发布中...';
        const res = await API.post('/api/posts', { title, content, sectionId, tags });
        btn.disabled = false;
        btn.textContent = '发布帖子';

        if (res.success && res.data) {
            showNotification('发帖成功', 'success');
            location.hash = `#/post/${res.data.id}`;
        } else {
            showNotification(res.message || '发帖失败', 'error');
        }
    }

    /**
     * 渲染搜索结果页
     * @param {string} keyword - 搜索关键词
     */
    async function renderSearch(keyword) {
        const app = document.getElementById('app');

        if (!keyword) {
            app.innerHTML = `
                <div class="form-container">
                    <div class="form-group">
                        <input type="text" class="form-input" id="searchInput" placeholder="输入关键词搜索帖子..." style="height:44px;" />
                    </div>
                    <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="doSearch()">搜索</button>
                </div>
                ${renderEmpty('请输入搜索关键词')}
            `;
            return;
        }

        app.innerHTML = renderLoading();
        const res = await API.get(`/api/posts/search?keyword=${encodeURIComponent(keyword)}`);
        const posts = (res.success && res.data) ? res.data : [];

        const postsHtml = posts.length > 0
            ? posts.map(renderPostCard).join('')
            : renderEmpty(`未找到与「${escapeHtml(keyword)}」相关的帖子`);

        app.innerHTML = `
            <div class="form-container mb-4">
                <div class="form-group" style="display:flex;gap:8px;">
                    <input type="text" class="form-input" id="searchInput" value="${escapeHtml(keyword)}" placeholder="搜索帖子..." style="height:42px;" />
                    <button class="btn btn-primary" onclick="doSearch()">搜索</button>
                </div>
            </div>
            <div class="section-title"><span class="emoji">🔍</span> 搜索结果：${escapeHtml(keyword)} (${posts.length})</div>
            <div class="post-list">${postsHtml}</div>
        `;
    }

    /**
     * 执行搜索
     */
    function doSearch() {
        const input = document.getElementById('searchInput');
        const keyword = input.value.trim();
        if (!keyword) {
            showNotification('请输入搜索关键词', 'warning');
            return;
        }
        location.hash = `#/search?keyword=${encodeURIComponent(keyword)}`;
    }

    /**
     * 渲染个人中心
     */
    async function renderProfile() {
        if (!checkLogin()) return;
        const app = document.getElementById('app');
        app.innerHTML = renderLoading();

        const [profileRes, postsRes] = await Promise.all([
            API.get('/api/users/profile'),
            API.get(`/api/posts/user/${state.user.id}`)
        ]);

        const profile = (profileRes.success && profileRes.data) ? profileRes.data : null;
        const posts = (postsRes.success && postsRes.data) ? postsRes.data : [];

        if (!profile) {
            app.innerHTML = renderEmpty('获取用户信息失败');
            return;
        }

        const postsHtml = posts.length > 0
            ? posts.map(renderPostCard).join('')
            : renderEmpty('暂无发帖记录');

        app.innerHTML = `
            <div class="profile-header">
                ${getAvatarHtml(profile.avatar, profile.nickname || profile.username, 'lg')}
                <div class="profile-info">
                    <div class="profile-name">${escapeHtml(profile.nickname || profile.username)}</div>
                    <div class="text-muted text-sm">@${escapeHtml(profile.username)}</div>
                    <div class="profile-signature mt-2">${escapeHtml(profile.signature || '这个人很懒，什么都没留下')}</div>
                    <div class="profile-stats mt-2">
                        <div class="stat-item">
                            <div class="stat-num">${profile.postCount || 0}</div>
                            <div class="stat-label">发帖</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-num">${profile.followerCount || 0}</div>
                            <div class="stat-label">粉丝</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-num">${profile.followingCount || 0}</div>
                            <div class="stat-label">关注</div>
                        </div>
                    </div>
                </div>
                <button class="btn btn-outline" onclick="showEditProfileModal()">编辑资料</button>
            </div>
            <div class="tabs">
                <div class="tab active" onclick="switchProfileTab('posts', this)">📝 发布历史</div>
                <div class="tab" onclick="switchProfileTab('favorites', this)">⭐ 收藏夹</div>
                <div class="tab" onclick="switchProfileTab('following', this)">👥 关注列表</div>
                <div class="tab" onclick="switchProfileTab('followers', this)">❤ 粉丝列表</div>
                <div class="tab" onclick="switchProfileTab('security', this)">🔒 账号安全</div>
            </div>
            <div id="profileContent">${postsHtml}</div>
        `;
    }

    /**
     * 切换个人中心 Tab
     * @param {string} tab - Tab 名称
     * @param {element} el - 当前 Tab 元素
     */
    async function switchProfileTab(tab, el) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        const content = document.getElementById('profileContent');
        content.innerHTML = renderLoading();

        if (tab === 'posts') {
            const res = await API.get(`/api/posts/user/${state.user.id}`);
            const posts = (res.success && res.data) ? res.data : [];
            content.innerHTML = posts.length > 0 ? posts.map(renderPostCard).join('') : renderEmpty('暂无发帖记录');
        } else if (tab === 'favorites') {
            const res = await API.get('/api/interaction/favorites');
            const favorites = (res.success && res.data) ? res.data : [];
            if (favorites.length === 0) {
                content.innerHTML = renderEmpty('暂无收藏');
            } else {
                // 逐个获取帖子详情
                const postPromises = favorites.map(f => API.get(`/api/posts/${f.postId}`));
                const postResults = await Promise.all(postPromises);
                const posts = postResults.filter(r => r.success && r.data).map(r => r.data);
                content.innerHTML = posts.length > 0 ? posts.map(renderPostCard).join('') : renderEmpty('收藏的帖子已不存在');
            }
        } else if (tab === 'following') {
            const res = await API.get('/api/interaction/following');
            const following = (res.success && res.data) ? res.data : [];
            if (following.length === 0) {
                content.innerHTML = renderEmpty('暂无关注');
            } else {
                // 获取关注用户信息
                const userPromises = following.map(f => API.get(`/api/users/${f.followeeId}`));
                const userResults = await Promise.all(userPromises);
                const users = userResults.filter(r => r.success && r.data).map(r => r.data);
                // 关注列表中的用户均为已关注状态，isFollowing 传 true
                content.innerHTML = users.map(u => renderUserCard(u, true)).join('') || renderEmpty('关注用户不存在');
            }
        } else if (tab === 'followers') {
            const res = await API.get('/api/interaction/followers');
            const followers = (res.success && res.data) ? res.data : [];
            if (followers.length === 0) {
                content.innerHTML = renderEmpty('暂无粉丝');
            } else {
                // 获取当前用户关注列表，用于判断每个粉丝是否已被自己关注
                const followingRes = await API.get('/api/interaction/following');
                const followingList = (followingRes.success && followingRes.data) ? followingRes.data : [];
                const followingIds = new Set(followingList.map(f => f.followeeId));
                const userPromises = followers.map(f => API.get(`/api/users/${f.followerId}`));
                const userResults = await Promise.all(userPromises);
                const users = userResults.filter(r => r.success && r.data).map(r => r.data);
                content.innerHTML = users.map(u => renderUserCard(u, followingIds.has(u.id))).join('') || renderEmpty('粉丝不存在');
            }
        } else if (tab === 'security') {
            content.innerHTML = `
                <div class="card">
                    <div class="card-body">
                        <div class="section-title">🔒 修改密码</div>
                        <div class="form-group">
                            <label class="form-label">原密码</label>
                            <input type="password" class="form-input" id="oldPassword" placeholder="请输入原密码" />
                        </div>
                        <div class="form-group">
                            <label class="form-label">新密码</label>
                            <input type="password" class="form-input" id="newPassword" placeholder="请输入新密码" />
                        </div>
                        <div class="form-group">
                            <label class="form-label">确认新密码</label>
                            <input type="password" class="form-input" id="confirmPassword" placeholder="请再次输入新密码" />
                        </div>
                        <button class="btn btn-primary" onclick="changePassword()">修改密码</button>
                    </div>
                </div>
            `;
        }
    }

    /**
     * 渲染用户卡片
     * @param {object} user - 用户数据
     * @param {boolean} [isFollowing] - 是否已关注该用户，控制按钮文案
     * @returns {string} 用户卡片 HTML
     */
    function renderUserCard(user, isFollowing) {
        // 判断是否为当前登录用户自己，自己不显示关注按钮
        const isSelf = state.user && state.user.id === user.id;
        // 关注按钮：已关注显示"取消关注"，未关注显示"关注"
        const followBtn = isSelf ? '' : `
            <button onclick="toggleFollow(${user.id})" class="btn ${isFollowing ? 'btn-outline' : 'btn-primary'} btn-follow" data-following="${isFollowing ? '1' : '0'}">
                ${isFollowing ? '取消关注' : '关注'}
            </button>
        `;
        return `
            <div class="card mb-4">
                <div class="card-body" style="display:flex;align-items:center;gap:16px;">
                    ${getAvatarHtml(user.avatar, user.nickname || user.username)}
                    <div style="flex:1;">
                        <div style="font-weight:700;font-size:15px;">${escapeHtml(user.nickname || user.username)}</div>
                        <div class="text-muted text-sm">@${escapeHtml(user.username)}</div>
                        <div class="text-muted text-sm">${escapeHtml(user.signature || '')}</div>
                    </div>
                    <div class="text-sm text-muted">
                        发帖 ${user.postCount || 0} · 粉丝 ${user.followerCount || 0}
                    </div>
                    ${followBtn}
                </div>
            </div>
        `;
    }

    /**
     * 关注/取消关注用户
     * @param {number} userId - 目标用户 ID
     * @returns {Promise<void>}
     */
    async function toggleFollow(userId) {
        // 未登录时跳转登录页
        if (!state.user) {
            showNotification('请先登录', 'warning');
            location.hash = '#/login';
            return;
        }
        // 禁止关注自己
        if (state.user.id === userId) {
            showNotification('不能关注自己', 'warning');
            return;
        }
        try {
            const res = await API.post(`/api/interaction/follow?userId=${userId}`);
            if (res.success) {
                // res.data 为 true 表示已关注，false 表示已取消关注
                showNotification(res.data ? '已关注' : '已取消关注', 'success');
                // 重新渲染当前列表以刷新按钮状态
                const activeTab = document.querySelector('.tab.active');
                if (activeTab) {
                    const tabText = activeTab.textContent.trim();
                    if (tabText.includes('关注列表')) {
                        switchProfileTab('following', activeTab);
                    } else if (tabText.includes('粉丝列表')) {
                        switchProfileTab('followers', activeTab);
                    }
                }
            } else {
                showNotification(res.message || '操作失败', 'warning');
            }
        } catch (e) {
            console.error('关注操作失败:', e);
            showNotification('操作失败', 'warning');
        }
    }

    /**
     * 显示编辑资料模态框
     */
    function showEditProfileModal() {
        API.get('/api/users/profile').then(res => {
            if (!res.success || !res.data) {
                showNotification('获取资料失败', 'error');
                return;
            }
            const p = res.data;
            showModal('编辑资料', `
                <div class="form-group">
                    <label class="form-label">昵称</label>
                    <input type="text" class="form-input" id="editNickname" value="${escapeHtml(p.nickname || '')}" />
                </div>
                <div class="form-group">
                    <label class="form-label">头像 URL</label>
                    <input type="text" class="form-input" id="editAvatar" value="${escapeHtml(p.avatar || '')}" placeholder="输入头像图片地址" />
                </div>
                <div class="form-group">
                    <label class="form-label">个性签名</label>
                    <input type="text" class="form-input" id="editSignature" value="${escapeHtml(p.signature || '')}" />
                </div>
                <div class="form-group">
                    <label class="form-label">个人简介</label>
                    <textarea class="form-input" id="editBio" style="min-height:80px;">${escapeHtml(p.bio || '')}</textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">邮箱</label>
                    <input type="email" class="form-input" id="editEmail" value="${escapeHtml(p.email || '')}" />
                </div>
            `, async () => {
                const data = {
                    nickname: document.getElementById('editNickname').value.trim(),
                    avatar: document.getElementById('editAvatar').value.trim(),
                    signature: document.getElementById('editSignature').value.trim(),
                    bio: document.getElementById('editBio').value.trim(),
                    email: document.getElementById('editEmail').value.trim()
                };
                const updateRes = await API.put('/api/users/profile', data);
                if (updateRes.success) {
                    showNotification('资料更新成功', 'success');
                    renderProfile();
                } else {
                    showNotification(updateRes.message || '更新失败', 'error');
                }
            });
        });
    }

    /**
     * 修改密码
     */
    async function changePassword() {
        const oldPassword = document.getElementById('oldPassword').value.trim();
        const newPassword = document.getElementById('newPassword').value.trim();
        const confirmPassword = document.getElementById('confirmPassword').value.trim();
        if (!oldPassword || !newPassword) {
            showNotification('请填写密码', 'warning');
            return;
        }
        if (newPassword !== confirmPassword) {
            showNotification('两次输入的新密码不一致', 'warning');
            return;
        }
        const res = await API.put('/api/users/password', { oldPassword, newPassword });
        if (res.success) {
            showNotification('密码修改成功', 'success');
            document.getElementById('oldPassword').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
        } else {
            showNotification(res.message || '修改失败', 'error');
        }
    }

    /**
     * 渲染新闻详情页
     * @param {string} id - 新闻 ID
     */
    async function renderNews(id) {
        const app = document.getElementById('app');
        app.innerHTML = renderLoading();

        const res = await API.get(`/api/news/${id}`);
        const news = (res.success && res.data) ? res.data : null;

        if (!news) {
            app.innerHTML = renderEmpty('新闻不存在');
            return;
        }

        app.innerHTML = `
            <div class="breadcrumb">
                <a onclick="location.hash = '#/'">首页</a>
                <span class="separator">/</span>
                <span>资讯详情</span>
            </div>
            <div class="news-detail">
                <h1>${escapeHtml(news.title)}</h1>
                <div class="news-meta">
                    <span class="badge badge-section">${escapeHtml(news.category || '资讯')}</span>
                    <span>👁 ${news.viewCount || 0} 浏览</span>
                    <span>🕒 发布于 ${formatDate(news.createdAt)}</span>
                    <span>✏ 更新于 ${formatDate(news.updateTime)}</span>
                </div>
                <div class="news-body">${escapeHtml(news.content)}</div>
            </div>
        `;
    }

    /**
     * 渲染作品详情页
     * @param {string} id - 作品 ID
     */
    async function renderWork(id) {
        const app = document.getElementById('app');
        app.innerHTML = renderLoading();

        const res = await API.get(`/api/works/${id}`);
        const work = (res.success && res.data) ? res.data : null;

        if (!work) {
            app.innerHTML = renderEmpty('作品不存在');
            return;
        }

        const tags = work.tags ? work.tags.split(/[,，]/).map(t => t.trim()).filter(t => t) : [];
        const tagsHtml = tags.map(t => `<span class="post-tag">${escapeHtml(t)}</span>`).join('');

        app.innerHTML = `
            <div class="breadcrumb">
                <a onclick="location.hash = '#/'">首页</a>
                <span class="separator">/</span>
                <span>作品详情</span>
            </div>
            <div class="work-detail">
                <div class="work-detail-cover">${escapeHtml(work.type || '作品')}</div>
                <div class="work-detail-info">
                    <h1>${escapeHtml(work.title)}</h1>
                    <div class="work-detail-rating">★ ${work.rating ? work.rating.toFixed(1) : '-'}</div>
                    <div class="work-detail-desc">${escapeHtml(work.description || '暂无描述')}</div>
                    <div class="text-muted text-sm mb-4">
                        类型：${escapeHtml(work.type || '未知')} · 更新于 ${formatDate(work.updateTime)}
                    </div>
                    ${tagsHtml ? `<div class="work-detail-tags">${tagsHtml}</div>` : ''}
                </div>
            </div>
        `;
    }

    /**
     * 渲染通知页
     */
    async function renderNotifications() {
        if (!checkLogin()) return;
        const app = document.getElementById('app');
        app.innerHTML = renderLoading();

        const res = await API.get('/api/notifications');
        const notifications = (res.success && res.data) ? res.data : [];

        const typeEmoji = {
            'LIKE': '❤',
            'COMMENT': '💬',
            'REPLY': '💬',
            'FOLLOW': '👥',
            'SYSTEM': '📢',
            'FAVORITE': '⭐'
        };

        const listHtml = notifications.length > 0
            ? notifications.map(n => `
                <div class="notification-item ${n.isRead ? '' : 'unread'}" onclick="markNotificationRead(${n.id}, ${n.relatedId || 0})">
                    ${!n.isRead ? '<div class="notification-dot"></div>' : '<div style="width:8px;"></div>'}
                    <span style="font-size:20px;">${typeEmoji[n.type] || '🔔'}</span>
                    <div class="notification-content">
                        ${escapeHtml(n.content || '')}
                        ${n.senderName ? `<div class="text-muted text-sm">来自 ${escapeHtml(n.senderName)}</div>` : ''}
                    </div>
                    <div class="notification-time">${formatDate(n.createdAt)}</div>
                </div>
            `).join('')
            : renderEmpty('暂无通知');

        app.innerHTML = `
            <div class="card">
                <div class="card-body">
                    <div class="section-header">
                        <div class="section-title"><span class="emoji">🔔</span> 消息通知</div>
                        ${notifications.length > 0 ? '<button class="btn btn-outline btn-sm" onclick="markAllRead()">全部已读</button>' : ''}
                    </div>
                    <div id="notificationsList">${listHtml}</div>
                </div>
            </div>
        `;
    }

    /**
     * 标记通知已读
     * @param {number} id - 通知 ID
     * @param {number} relatedId - 关联 ID
     */
    async function markNotificationRead(id, relatedId) {
        const res = await API.put(`/api/notifications/${id}/read`);
        if (res.success) {
            fetchUnreadCount();
            renderNotifications();
        }
    }

    /**
     * 标记全部已读
     */
    async function markAllRead() {
        const res = await API.put('/api/notifications/read-all');
        if (res.success) {
            showNotification('已全部标记为已读', 'success');
            state.unreadCount = 0;
            renderNavActions();
            renderNotifications();
        } else {
            showNotification(res.message || '操作失败', 'error');
        }
    }

    // ========== 初始化 ==========

    /**
     * 初始化应用
     */
    async function init() {
        await fetchCurrentUser();
        fetchUnreadCount();

        // 搜索框回车事件
        const searchInput = document.getElementById('navSearchInput');
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const keyword = searchInput.value.trim();
                if (keyword) {
                    location.hash = `#/search?keyword=${encodeURIComponent(keyword)}`;
                    searchInput.value = '';
                }
            }
        });

        // 路由监听
        window.addEventListener('hashchange', router);
        router();

        // 定时刷新未读数
        setInterval(fetchUnreadCount, 60000);
    }

    // 启动应用
    init();
</script>
</body>
</html>
