<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>次元社 - 二次元讨论社区</title>
    <style>
        /* ========== 设计变量 ========== */
        :root {
            --primary: #7c5cfc;
            --primary-light: #f0edff;
            --primary-dark: #5a3fd6;
            --accent: #ff6b9d;
            --accent-light: #fff0f5;
            --bg: #ffffff;
            --bg2: #f6f5fc;
            --text: #1a1a2e;
            --muted: #6a6a85;
            --border: #e0e0ea;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 2px 12px rgba(124, 92, 252, 0.08);
            --shadow-hover: 0 6px 24px rgba(124, 92, 252, 0.15);
            --gradient: linear-gradient(135deg, #7c5cfc 0%, #ff6b9d 100%);
            --max-width: 1200px;
        }

        /* ========== 基础重置 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: var(--bg2);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a {
            color: var(--primary);
            text-decoration: none;
            transition: color 0.2s;
        }

        a:hover {
            color: var(--primary-dark);
        }

        img {
            max-width: 100%;
            display: block;
        }

        /* ========== 导航栏 ========== */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .navbar-inner {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 20px;
            height: 64px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            cursor: pointer;
            white-space: nowrap;
        }

        .nav-search {
            flex: 1;
            max-width: 400px;
            position: relative;
        }

        .nav-search input {
            width: 100%;
            height: 38px;
            padding: 0 16px 0 40px;
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 14px;
            background: var(--bg2);
            transition: all 0.2s;
        }

        .nav-search input:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--bg);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .nav-search .icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 16px;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 18px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(124, 92, 252, 0.3);
        }

        .btn-accent {
            background: var(--accent);
            color: #fff;
        }

        .btn-accent:hover {
            background: #e85a8a;
            transform: translateY(-1px);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }

        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn-ghost {
            background: transparent;
            color: var(--muted);
            padding: 8px 12px;
        }

        .btn-ghost:hover {
            color: var(--primary);
            background: var(--primary-light);
        }

        .btn-danger {
            background: var(--danger);
            color: #fff;
        }

        .btn-sm {
            padding: 4px 12px;
            font-size: 12px;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border);
            cursor: pointer;
        }

        .avatar-lg {
            width: 80px;
            height: 80px;
        }

        .avatar-placeholder {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--gradient);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }

        .avatar-placeholder-lg {
            width: 80px;
            height: 80px;
            font-size: 28px;
        }

        .nav-user {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            position: relative;
        }

        .nav-username {
            font-size: 14px;
            font-weight: 600;
            max-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .dropdown-menu {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 8px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-hover);
            min-width: 160px;
            overflow: hidden;
            display: none;
        }

        .dropdown-menu.show {
            display: block;
        }

        .dropdown-item {
            display: block;
            padding: 10px 16px;
            font-size: 14px;
            color: var(--text);
            cursor: pointer;
            transition: background 0.15s;
        }

        .dropdown-item:hover {
            background: var(--bg2);
            color: var(--primary);
        }

        /* ========== 主内容区 ========== */
        .main-content {
            flex: 1;
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 24px 20px;
            width: 100%;
        }

        /* ========== 通用卡片 ========== */
        .card {
            background: var(--bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            transition: box-shadow 0.2s;
        }

        .card:hover {
            box-shadow: var(--shadow-hover);
        }

        .card-body {
            padding: 20px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title .emoji {
            font-size: 24px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        /* ========== 轮播区 ========== */
        .carousel {
            position: relative;
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: 32px;
            box-shadow: var(--shadow);
        }

        .carousel-track {
            display: flex;
            transition: transform 0.5s ease;
        }

        .carousel-slide {
            min-width: 100%;
            height: 280px;
            position: relative;
            background: var(--gradient);
            display: flex;
            align-items: center;
            padding: 32px;
        }

        .carousel-slide.bg2 { background: linear-gradient(135deg, #ff6b9d 0%, #7c5cfc 100%); }
        .carousel-slide.bg3 { background: linear-gradient(135deg, #7c5cfc 0%, #4facfe 100%); }
        .carousel-slide.bg4 { background: linear-gradient(135deg, #ff6b9d 0%, #ffc371 100%); }
        .carousel-slide.bg5 { background: linear-gradient(135deg, #43e97b 0%, #7c5cfc 100%); }

        .carousel-content {
            color: #fff;
            max-width: 600px;
            z-index: 1;
        }

        .carousel-content .tag {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 12px;
            font-size: 12px;
            margin-bottom: 12px;
        }

        .carousel-content h2 {
            font-size: 26px;
            margin-bottom: 12px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .carousel-content p {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 16px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .carousel-content .btn {
            background: rgba(255, 255, 255, 0.95);
            color: var(--primary);
        }

        .carousel-dots {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
        }

        .carousel-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.2s;
        }

        .carousel-dot.active {
            background: #fff;
            width: 24px;
            border-radius: 4px;
        }

        /* ========== 板块网格 ========== */
        .section-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }

        .section-card {
            background: var(--bg);
            border-radius: var(--radius);
            padding: 20px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: var(--shadow);
            border: 1px solid transparent;
        }

        .section-card:hover {
            border-color: var(--primary);
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        .section-card .icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin: 0 auto 12px;
        }

        .section-card .name {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .section-card .desc {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.4;
        }

        .section-card .count {
            font-size: 12px;
            color: var(--accent);
            margin-top: 8px;
            font-weight: 600;
        }

        /* ========== 作品列表 ========== */
        .work-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }

        .work-card {
            background: var(--bg);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: var(--shadow);
        }

        .work-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        .work-cover {
            width: 100%;
            height: 180px;
            background: var(--gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: rgba(255, 255, 255, 0.6);
        }

        .work-info {
            padding: 12px;
        }

        .work-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .work-meta {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--muted);
        }

        .work-rating {
            color: var(--warning);
            font-weight: 700;
        }

        /* ========== 帖子列表 ========== */
        .post-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .post-card {
            background: var(--bg);
            border-radius: var(--radius);
            padding: 18px 20px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: var(--shadow);
            border-left: 3px solid transparent;
        }

        .post-card:hover {
            border-left-color: var(--primary);
            box-shadow: var(--shadow-hover);
        }

        .post-card .post-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .post-card .post-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .post-card:hover .post-title {
            color: var(--primary);
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-top {
            background: var(--danger);
            color: #fff;
        }

        .badge-essence {
            background: var(--warning);
            color: #fff;
        }

        .badge-section {
            background: var(--primary-light);
            color: var(--primary);
        }

        .post-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 12px;
            color: var(--muted);
            flex-wrap: wrap;
        }

        .post-meta .meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .post-tags {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .post-tag {
            padding: 2px 8px;
            background: var(--accent-light);
            color: var(--accent);
            border-radius: 4px;
            font-size: 11px;
        }

        /* ========== 表单 ========== */
        .form-container {
            max-width: 420px;
            margin: 40px auto;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text);
        }

        .form-input,
        .form-textarea,
        .form-select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-family: inherit;
            background: var(--bg);
            transition: all 0.2s;
        }

        .form-input:focus,
        .form-textarea:focus,
        .form-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .form-textarea {
            min-height: 200px;
            resize: vertical;
            line-height: 1.6;
        }

        .form-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 24px;
            border-bottom: 2px solid var(--border);
        }

        .form-tab {
            padding: 10px 20px;
            font-size: 15px;
            font-weight: 600;
            color: var(--muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
        }

        .form-tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        /* ========== 帖子详情 ========== */
        .post-detail {
            background: var(--bg);
            border-radius: var(--radius);
            padding: 28px;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
        }

        .post-detail h1 {
            font-size: 24px;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .post-detail .author-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .post-detail .author-info {
            flex: 1;
        }

        .post-detail .author-name {
            font-size: 14px;
            font-weight: 600;
        }

        .post-detail .post-time {
            font-size: 12px;
            color: var(--muted);
        }

        .post-content {
            font-size: 15px;
            line-height: 1.8;
            white-space: pre-wrap;
            word-break: break-word;
            margin-bottom: 24px;
        }

        .post-actions {
            display: flex;
            gap: 12px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .action-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--bg);
            color: var(--text);
        }

        .action-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .action-btn.active {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
        }

        .action-btn.active.liked {
            background: var(--accent-light);
            border-color: var(--accent);
            color: var(--accent);
        }

        /* ========== 评论区 ========== */
        .comments-section {
            background: var(--bg);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
        }

        .comment-item {
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
        }

        .comment-item:last-child {
            border-bottom: none;
        }

        .comment-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .comment-floor {
            font-size: 12px;
            color: var(--muted);
            background: var(--bg2);
            padding: 2px 8px;
            border-radius: 4px;
        }

        /* 楼层引用块样式 */
        .comment-quote {
            margin-left: 46px;
            margin-bottom: 8px;
            padding: 8px 12px;
            background: var(--primary-light);
            border-left: 3px solid var(--primary);
            border-radius: 4px;
            font-size: 13px;
            color: var(--muted);
        }
        .comment-quote .quote-floor {
            display: inline-block;
            font-size: 11px;
            color: var(--primary);
            font-weight: 600;
            margin-right: 6px;
        }
        .comment-quote .quote-author {
            color: var(--text);
            font-weight: 500;
            margin-right: 6px;
        }
        .comment-quote .quote-content {
            color: var(--muted);
        }

        /* @提及高亮样式 */
        .mention {
            color: var(--primary);
            font-weight: 500;
            background: var(--primary-light);
            padding: 0 4px;
            border-radius: 3px;
            cursor: pointer;
        }
        .mention:hover {
            background: var(--primary);
            color: #fff;
        }

        .comment-content {
            font-size: 14px;
            line-height: 1.6;
            padding-left: 46px;
            margin-bottom: 8px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .comment-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-left: 46px;
            font-size: 12px;
            color: var(--muted);
        }

        .comment-reply-btn {
            cursor: pointer;
            color: var(--primary);
        }

        .comment-reply-form {
            margin: 12px 0 12px 46px;
            display: none;
        }

        .comment-reply-form.show {
            display: block;
        }

        /* ========== 个人中心 ========== */
        .profile-header {
            background: var(--bg);
            border-radius: var(--radius);
            padding: 28px;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .profile-info {
            flex: 1;
        }

        .profile-name {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .profile-signature {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .profile-stats {
            display: flex;
            gap: 24px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-num {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-label {
            font-size: 12px;
            color: var(--muted);
        }

        .tabs {
            display: flex;
            gap: 0;
            border-bottom: 2px solid var(--border);
            margin-bottom: 20px;
            overflow-x: auto;
        }

        .tab {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            color: var(--muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        /* ========== 通知 ========== */
        .notification-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.15s;
        }

        .notification-item:hover {
            background: var(--bg2);
        }

        .notification-item.unread {
            background: var(--primary-light);
        }

        .notification-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            flex-shrink: 0;
        }

        .notification-content {
            flex: 1;
            font-size: 14px;
        }

        .notification-time {
            font-size: 12px;
            color: var(--muted);
        }

        /* ========== 空状态 ========== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
        }

        .empty-state .emoji {
            font-size: 64px;
            margin-bottom: 16px;
            display: block;
        }

        .empty-state .text {
            font-size: 15px;
        }

        /* ========== 加载状态 ========== */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--muted);
        }

        .loading .spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ========== 轻提示 ========== */
        .toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text);
            color: #fff;
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            z-index: 1000;
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            top: 90px;
        }

        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        .toast.warning { background: var(--warning); }

        /* ========== 模态框 ========== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: var(--bg);
            border-radius: var(--radius);
            padding: 28px;
            max-width: 480px;
            width: 90%;
            box-shadow: var(--shadow-hover);
        }

        .modal h3 {
            font-size: 18px;
            margin-bottom: 16px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        /* ========== 页脚 ========== */
        .footer {
            background: var(--text);
            color: #a0a0b5;
            padding: 32px 20px 20px;
            margin-top: auto;
        }

        .footer-inner {
            max-width: var(--max-width);
            margin: 0 auto;
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 32px;
        }

        .footer-brand h3 {
            font-size: 20px;
            font-weight: 800;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .footer-brand p {
            font-size: 13px;
            line-height: 1.6;
        }

        .footer-col h4 {
            color: #fff;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .footer-col a {
            display: block;
            color: #a0a0b5;
            font-size: 13px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .footer-col a:hover {
            color: var(--accent);
        }

        .footer-bottom {
            max-width: var(--max-width);
            margin: 24px auto 0;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            font-size: 12px;
            color: #6a6a85;
        }

        /* ========== 面包屑 ========== */
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 16px;
        }

        .breadcrumb a {
            color: var(--muted);
        }

        .breadcrumb a:hover {
            color: var(--primary);
        }

        .breadcrumb .separator {
            color: var(--border);
        }

        /* ========== 新闻详情 ========== */
        .news-detail {
            background: var(--bg);
            border-radius: var(--radius);
            padding: 32px;
            box-shadow: var(--shadow);
        }

        .news-detail h1 {
            font-size: 26px;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .news-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 13px;
            color: var(--muted);
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .news-body {
            font-size: 15px;
            line-height: 1.8;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* ========== 作品详情 ========== */
        .work-detail {
            background: var(--bg);
            border-radius: var(--radius);
            padding: 28px;
            box-shadow: var(--shadow);
            display: flex;
            gap: 24px;
            margin-bottom: 24px;
        }

        .work-detail-cover {
            width: 200px;
            height: 280px;
            border-radius: var(--radius-sm);
            background: var(--gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 72px;
            color: rgba(255, 255, 255, 0.6);
            flex-shrink: 0;
        }

        .work-detail-info {
            flex: 1;
        }

        .work-detail-info h1 {
            font-size: 24px;
            margin-bottom: 12px;
        }

        .work-detail-rating {
            font-size: 28px;
            font-weight: 800;
            color: var(--warning);
            margin-bottom: 12px;
        }

        .work-detail-desc {
            font-size: 14px;
            line-height: 1.7;
            color: var(--text);
            margin-bottom: 16px;
        }

        .work-detail-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 768px) {
            .navbar-inner {
                height: 56px;
                gap: 8px;
                padding: 0 12px;
            }

            .nav-search {
                max-width: none;
            }

            .nav-username {
                display: none;
            }

            .logo {
                font-size: 18px;
            }

            .main-content {
                padding: 16px 12px;
            }

            .section-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .work-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .carousel-slide {
                height: 200px;
                padding: 20px;
            }

            .carousel-content h2 {
                font-size: 18px;
            }

            .post-detail {
                padding: 20px 16px;
            }

            .post-detail h1 {
                font-size: 20px;
            }

            .profile-header {
                flex-direction: column;
                text-align: center;
                padding: 20px;
            }

            .work-detail {
                flex-direction: column;
                padding: 20px;
            }

            .work-detail-cover {
                width: 100%;
                height: 200px;
                margin: 0 auto;
            }

            .footer-inner {
                grid-template-columns: 1fr 1fr;
                gap: 20px;
            }

            .nav-search input {
                height: 34px;
                font-size: 13px;
            }

            .btn {
                padding: 6px 14px;
                font-size: 13px;
            }

            .comment-content {
                padding-left: 0;
            }

            .comment-meta {
                padding-left: 0;
            }
        }

        @media (max-width: 480px) {
            .section-grid {
                grid-template-columns: 1fr 1fr;
            }

            .work-grid {
                grid-template-columns: 1fr;
            }

            .post-meta {
                gap: 10px;
            }

            .footer-inner {
                grid-template-columns: 1fr;
            }
        }

        /* ========== 工具类 ========== */
        .text-center { text-align: center; }
        .text-muted { color: var(--muted); }
        .text-sm { font-size: 12px; }
        .mt-2 { margin-top: 8px; }
        .mt-4 { margin-top: 16px; }
        .mb-4 { margin-bottom: 16px; }
        .flex { display: flex; }
        .gap-2 { gap: 8px; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
    </style>
</head>

<!-- 主内容区 -->
<main class="main-content" id="app"></main>

<!-- 页脚 -->
<footer class="footer">
    <div class="footer-inner">
        <div class="footer-brand">
            <h3>🌸 次元社</h3>
            <p>属于二次元爱好者的讨论社区，在这里分享你的热爱，找到同好伙伴。动画、漫画、游戏、轻小说、同人创作，一站式交流平台。</p>
        </div>

<!-- 轻提示 -->
<div class="toast" id="toast"></div>

<!-- 模态框 -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalContent"></div>
</div>

<script>
    // ========== API 封装 ==========
    const API_BASE = 'http://localhost:8089';

    /**
     * API 请求封装对象
     * 统一处理 fetch 请求，包含 Session 凭证携带、JSON 序列化与错误处理
     */
    const API = {
        /**
         * 发起 API 请求
         * @param {string} url - API 路径（以 /api 开头）
         * @param {object} options - fetch 配置项
         * @returns {Promise<object>} 解析后的响应 JSON
         */
        async request(url, options = {}) {
            try {
                const fetchOptions = {
                    credentials: 'include',
                    headers: {},
                    ...options
                };
                if (options.body && typeof options.body === 'object') {
                    fetchOptions.headers['Content-Type'] = 'application/json';
                    fetchOptions.body = JSON.stringify(options.body);
                }
                const response = await fetch(API_BASE + url, fetchOptions);
                if (response.status === 401) {
                    state.user = null;
                    showNotification('请先登录', 'warning');
                    location.hash = '#/login';
                    return { success: false, message: '未登录', data: null };
                }
                const text = await response.text();
                let data;
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    return { success: false, message: '服务器返回格式异常', data: null };
                }
                return data;
            } catch (err) {
                console.error('API请求失败:', err);
                return { success: false, message: '网络请求失败，请检查后端服务是否启动', data: null };
            }
        },

        async get(url) {
            return this.request(url, { method: 'GET' });
        },
        async post(url, data) {
            return this.request(url, { method: 'POST', body: data });
        },
        async put(url, data) {
            return this.request(url, { method: 'PUT', body: data });
        },
        async del(url) {
            return this.request(url, { method: 'DELETE' });
        }
    };

    // ========== 状态管理 ==========
    const state = {
        user: null,
        currentRoute: '',
        unreadCount: 0
    };

    // ========== 辅助函数 ==========

    /**
     * 格式化日期时间
     * @param {string|Date} date - 日期字符串或对象
     * @returns {string} 格式化后的时间字符串
     */
    function formatDate(date) {
        if (!date) return '未知';
        const d = new Date(date);
        if (isNaN(d.getTime())) return '未知';
        const now = new Date();
        const diff = (now - d) / 1000;
        if (diff < 60) return '刚刚';
        if (diff < 3600) return Math.floor(diff / 60) + '分钟前';
        if (diff < 86400) return Math.floor(diff / 3600) + '小时前';
        if (diff < 2592000) return Math.floor(diff / 86400) + '天前';
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        const h = String(d.getHours()).padStart(2, '0');
        const min = String(d.getMinutes()).padStart(2, '0');
        return `${y}-${m}-${day} ${h}:${min}`;
    }

    /**
     * HTML 转义，防止 XSS 攻击
     * @param {string} str - 原始字符串
     * @returns {string} 转义后的安全字符串
     */
    function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    /**
     * 显示轻提示
     * @param {string} msg - 提示消息
     * @param {string} type - 提示类型：success/error/warning
     * @param {number} duration - 显示时长（毫秒）
     */
    function showNotification(msg, type = '', duration = 2500) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.className = 'toast show ' + type;
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => {
            toast.className = 'toast ' + type;
        }, duration);
    }

    /**
     * 检查登录状态，未登录则跳转登录页
     * @returns {boolean} 是否已登录
     */
    function checkLogin() {
        if (!state.user) {
            showNotification('请先登录', 'warning');
            location.hash = '#/login';
            return false;
        }
        return true;
    }

    /**
     * 获取头像 HTML
     * @param {string} avatar - 头像 URL
     * @param {string} name - 用于占位符的名字
     * @param {string} size - 尺寸：默认或 lg
     * @returns {string} 头像 HTML
     */
    function getAvatarHtml(avatar, name, size = '') {
        const sizeClass = size === 'lg' ? ' avatar-lg' : '';
        const placeholderClass = size === 'lg' ? 'avatar-placeholder avatar-placeholder-lg' : 'avatar-placeholder';
        const initial = escapeHtml(((name || '?')[0] || '?').toUpperCase());
        if (avatar) {
            return `<img src="${escapeHtml(avatar)}" class="avatar${sizeClass}" alt="${escapeHtml(name || '用户')}" />`;
        }
        return `<div class="${placeholderClass}">${initial}</div>`;
    }

    /**
     * 获取板块图标 emoji
     * @param {string} icon - 板块图标标识
     * @returns {string} emoji 字符
     */
    function getSectionIcon(icon) {
        const iconMap = {
            'tv': '📺',
            'book': '📖',
            'gamepad': '🎮',
            'book-open': '📕',
            'palette': '🎨'
        };
        return iconMap[icon] || '💬';
    }

    /**
     * 显示模态框
     * @param {string} title - 标题
     * @param {string} bodyHtml - 内容 HTML
     * @param {function} onConfirm - 确认回调
     */
    function showModal(title, bodyHtml, onConfirm) {
        const overlay = document.getElementById('modalOverlay');
        const content = document.getElementById('modalContent');
        content.innerHTML = `
            <h3>${escapeHtml(title)}</h3>
            <div>${bodyHtml}</div>
            <div class="modal-actions">
                <button class="btn btn-outline" id="modalCancel">取消</button>
                <button class="btn btn-primary" id="modalConfirm">确认</button>
            </div>
        `;
        overlay.classList.add('show');
        document.getElementById('modalCancel').onclick = () => {
            overlay.classList.remove('show');
        };
        document.getElementById('modalConfirm').onclick = () => {
            if (onConfirm) onConfirm();
            overlay.classList.remove('show');
        };
        overlay.onclick = (e) => {
            if (e.target === overlay) overlay.classList.remove('show');
        };
    }

    /**
     * 关闭模态框
     */
    function closeModal() {
        document.getElementById('modalOverlay').classList.remove('show');
    }

    /**
     * 渲染帖子卡片
     * @param {object} post - 帖子数据
     * @returns {string} 帖子卡片 HTML
     */
    function renderPostCard(post) {
        const tagsHtml = (post.tags || []).map(t => `<span class="post-tag">${escapeHtml(t)}</span>`).join('');
        const badgesHtml = [
            post.isTop ? '<span class="badge badge-top">置顶</span>' : '',
            post.isEssence ? '<span class="badge badge-essence">精华</span>' : '',
            post.sectionName ? `<span class="badge badge-section">${escapeHtml(post.sectionName)}</span>` : ''
        ].join('');
        return `
            <div class="post-card" onclick="location.hash = '#/post/${post.id}'">
                <div class="post-header">
                    ${badgesHtml}
                    <span class="post-title">${escapeHtml(post.title)}</span>
                </div>
                <div class="post-meta">
                    <span class="meta-item">👤 ${escapeHtml(post.username || '匿名')}</span>
                    <span class="meta-item">👁 ${post.viewCount || 0}</span>
                    <span class="meta-item">❤ ${post.likeCount || 0}</span>
                    <span class="meta-item">💬 ${post.commentCount || 0}</span>
                    <span class="meta-item">⭐ ${post.favoriteCount || 0}</span>
                    <span class="meta-item">🕒 更新于 ${formatDate(post.updateTime)}</span>
                </div>
                ${tagsHtml ? `<div class="post-tags">${tagsHtml}</div>` : ''}
            </div>
        `;
    }

    /**
     * 渲染加载状态
     * @returns {string} 加载 HTML
     */
    function renderLoading() {
        return `<div class="loading"><div class="spinner"></div><div>加载中...</div></div>`;
    }

    /**
     * 渲染空状态
     * @param {string} text - 提示文字
     * @returns {string} 空状态 HTML
     */
    function renderEmpty(text = '暂无数据') {
        return `<div class="empty-state"><span class="emoji">🌸</span><div class="text">${escapeHtml(text)}</div></div>`;
    }

    // ========== 导航栏渲染 ==========

    /**
     * 渲染导航栏右侧操作区
     */
    function renderNavActions() {
        const navActions = document.getElementById('navActions');
        if (state.user) {
            const displayName = escapeHtml(state.user.nickname || state.user.username || '用户');
            const initial = (state.user.nickname || state.user.username || '?')[0].toUpperCase();
            navActions.innerHTML = `
                <button class="btn btn-primary btn-sm" onclick="location.hash = '#/post/create'">✏ 发帖</button>
                <div class="nav-user" id="navUser">
                    ${state.user.avatar
                        ? `<img src="${escapeHtml(state.user.avatar)}" class="avatar" alt="${escapeHtml(state.user.username || '用户')}" />`
                        : `<div class="avatar-placeholder">${initial}</div>`
                    }
                    <span class="nav-username">${displayName}</span>
                    <div class="dropdown-menu" id="userDropdown">
                        <a class="dropdown-item" onclick="location.hash = '#/profile'">👤 个人中心</a>
                        <a class="dropdown-item" onclick="location.hash = '#/notifications'">🔔 消息通知${state.unreadCount > 0 ? ` (${state.unreadCount})` : ''}</a>
                        <a class="dropdown-item" onclick="doLogout()">🚪 退出登录</a>
                    </div>
                </div>
            `;
            const navUser = document.getElementById('navUser');
            const dropdown = document.getElementById('userDropdown');
            navUser.onclick = (e) => {
                e.stopPropagation();
                dropdown.classList.toggle('show');
            };
            document.onclick = () => dropdown.classList.remove('show');
        } else {
            navActions.innerHTML = `
                <button class="btn btn-outline btn-sm" onclick="location.hash = '#/login'">登录</button>
                <button class="btn btn-primary btn-sm" onclick="location.hash = '#/login'">注册</button>
            `;
        }
    }

    /**
     * 获取当前登录用户信息
     */
    async function fetchCurrentUser() {
        const res = await API.get('/api/auth/me');
        if (res.success && res.data) {
            state.user = res.data;
        } else {
            state.user = null;
        }
        renderNavActions();
    }

    /**
     * 获取未读通知数
     */
    async function fetchUnreadCount() {
        if (!state.user) return;
        const res = await API.get('/api/notifications/unread-count');
        if (res.success && res.data !== null) {
            state.unreadCount = res.data;
            renderNavActions();
        }
    }

    /**
     * 退出登录
     */
    async function doLogout() {
        const res = await API.post('/api/auth/logout');
        if (res.success) {
            state.user = null;
            state.unreadCount = 0;
            showNotification('已退出登录', 'success');
            renderNavActions();
            location.hash = '#/';
        } else {
            showNotification(res.message || '退出失败', 'error');
        }
    }

    // ========== 路由 ==========

    /**
     * Hash 路由分发器，解析当前 hash 并渲染对应页面
     */
    function router() {
        const hash = location.hash.slice(1) || '/';
        state.currentRoute = hash;
        const app = document.getElementById('app');
        window.scrollTo(0, 0);

        // 解析路径和查询参数
        const [path, queryString] = hash.split('?');
        const params = new URLSearchParams(queryString || '');

        // 路由匹配
        if (path === '/' || path === '') {
            renderHome();
        } else if (path === '/login') {
            renderLogin();
        } else if (path.startsWith('/section/')) {
            const id = path.split('/')[2];
            renderSection(id);
        } else if (path.startsWith('/post/create')) {
            renderCreatePost();
        } else if (path.startsWith('/post/')) {
            const id = path.split('/')[2];
            renderPost(id);
        } else if (path === '/search') {
            renderSearch(params.get('keyword') || '');
        } else if (path === '/profile') {
            renderProfile();
        } else if (path.startsWith('/news/')) {
            const id = path.split('/')[2];
            renderNews(id);
        } else if (path.startsWith('/work/')) {
            const id = path.split('/')[2];
            renderWork(id);
        } else if (path === '/notifications') {
            renderNotifications();
        } else {
            app.innerHTML = renderEmpty('页面不存在');
        }

    /**
     * 初始化轮播组件
     * @param {number} total - 轮播总数
     */
    function initCarousel(total) {
        let current = 0;
        const track = document.querySelector('.carousel-track');
        const dots = document.querySelectorAll('.carousel-dot');
        if (!track || dots.length === 0) return;

        // 清理旧的轮播定时器，避免重复渲染首页时定时器堆叠
        if (window._carouselTimer) {
            clearInterval(window._carouselTimer);
        }

        const goSlide = (index) => {
            current = index;
            track.style.transform = `translateX(-${current * 100}%)`;
            dots.forEach((d, i) => d.classList.toggle('active', i === current));
        };

        dots.forEach((dot, i) => {
            dot.onclick = () => goSlide(i);
        });

        // 自动轮播
        window._carouselTimer = setInterval(() => {
            goSlide((current + 1) % total);
        }, 5000);
    }

    /**
     * 执行登录
     */
    async function doLogin() {
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        if (!username || !password) {
            showNotification('请填写用户名和密码', 'warning');
            return;
        }
        const btn = document.getElementById('loginBtn');
        btn.disabled = true;
        btn.textContent = '登录中...';
        const res = await API.post('/api/auth/login', { username, password });
        btn.disabled = false;
        btn.textContent = '登 录';
        if (res.success) {
            state.user = res.data;
            showNotification('登录成功', 'success');
            renderNavActions();
            location.hash = '#/';
        } else {
            showNotification(res.message || '登录失败', 'error');
        }
    }

    /**
     * 渲染帖子详情页
     * @param {string} id - 帖子 ID
     */
    async function renderPost(id) {
        const app = document.getElementById('app');
        app.innerHTML = renderLoading();

        const [postRes, commentsRes] = await Promise.all([
            API.get(`/api/posts/${id}`),
            API.get(`/api/comments/post/${id}`)
        ]);

        const post = (postRes.success && postRes.data) ? postRes.data : null;
        const comments = (commentsRes.success && commentsRes.data) ? commentsRes.data : [];

        if (!post) {
            app.innerHTML = renderEmpty('帖子不存在');
            return;
        }

        const tagsHtml = (post.tags || []).map(t => `<span class="post-tag">${escapeHtml(t)}</span>`).join('');
        const badgesHtml = [
            post.isTop ? '<span class="badge badge-top">置顶</span>' : '',
            post.isEssence ? '<span class="badge badge-essence">精华</span>' : '',
            post.sectionName ? `<span class="badge badge-section">${escapeHtml(post.sectionName)}</span>` : ''
        ].join('');

        // 评论列表 HTML（含楼层引用块与 @mention 高亮）
        const commentsHtml = comments.length > 0
            ? comments.map(c => {
                const replyFormHtml = state.user ? `
                    <div class="comment-reply-form" id="replyForm_${c.id}">
                        <textarea class="form-input" id="replyInput_${c.id}" placeholder="回复 ${escapeHtml(c.username)}..." style="min-height:80px;"></textarea>
                        <button class="btn btn-primary btn-sm mt-2" onclick="submitReply(${c.id}, ${post.id})">发送</button>
                    </div>
                ` : '';
                // 楼层引用块：若该评论有 parentId，查找父评论并渲染引用块
                let quoteHtml = '';
                if (c.parentId) {
                    const parentComment = comments.find(pc => pc.id === c.parentId);
                    if (parentComment) {
                        quoteHtml = `
                            <div class="comment-quote">
                                <span class="quote-floor">${parentComment.floor || 0}F</span>
                                <span class="quote-author">${escapeHtml(parentComment.username || '匿名')}</span>
                                <span class="quote-content">${escapeHtml(parentComment.content).substring(0, 100)}${parentComment.content.length > 100 ? '...' : ''}</span>
                            </div>
                        `;
                    }
                }
                // @mention 高亮：将 @用户名 渲染为高亮链接
                const mentionContent = escapeHtml(c.content).replace(
                    /@(\w{3,20})/g,
                    '<span class="mention">@$1</span>'
                );
                return `
                    <div class="comment-item">
                        <div class="comment-header">
                            ${getAvatarHtml(c.userAvatar, c.username)}
                            <span style="font-weight:600;font-size:14px;">${escapeHtml(c.username || '匿名')}</span>
                            <span class="comment-floor">${c.floor || 0}F</span>
                        </div>
                        ${quoteHtml}
                        <div class="comment-content">${mentionContent}</div>
                        <div class="comment-meta">
                            <span>🕒 更新于 ${formatDate(c.updateTime)}</span>
                            <span>❤ ${c.likeCount || 0}</span>
                            ${state.user ? `<span class="comment-reply-btn" onclick="toggleReplyForm(${c.id})">回复</span>` : ''}
                            ${state.user && state.user.id === c.userId ? `<span class="comment-reply-btn" style="color:var(--danger);" onclick="deleteComment(${c.id}, ${post.id})">删除</span>` : ''}
                        </div>
                        ${replyFormHtml}
                    </div>
                `;
            }).join('')
            : renderEmpty('暂无评论，快来抢沙发吧！');

        app.innerHTML = `
            <div class="breadcrumb">
                <a onclick="location.hash = '#/'">首页</a>
                <span class="separator">/</span>
                ${post.sectionId ? `<a onclick="location.hash = '#/section/${post.sectionId}'">${escapeHtml(post.sectionName || '板块')}</a><span class="separator">/</span>` : ''}
                <span>帖子详情</span>
            </div>
            <div class="post-detail">
                <h1>${escapeHtml(post.title)}</h1>
                <div class="author-bar">
                    ${getAvatarHtml(post.userAvatar, post.username)}
                    <div class="author-info">
                        <div class="author-name">${escapeHtml(post.username || '匿名')}</div>
                        <div class="post-time">
                            发布于 ${formatDate(post.createdAt)} · 更新于 ${formatDate(post.updateTime)}
                        </div>
                    </div>
                    ${badgesHtml}
                </div>
                <div class="post-content">${escapeHtml(post.content)}</div>
                ${tagsHtml ? `<div class="post-tags">${tagsHtml}</div>` : ''}
                <div class="post-actions">
                    <div class="action-btn ${post.isLiked ? 'active liked' : ''}" id="likeBtn" onclick="toggleLikePost(${post.id})">
                        ❤ ${post.isLiked ? '已点赞' : '点赞'} (${post.likeCount || 0})
                    </div>
                    <div class="action-btn ${post.isFavorited ? 'active' : ''}" id="favBtn" onclick="toggleFavoritePost(${post.id})">
                        ⭐ ${post.isFavorited ? '已收藏' : '收藏'} (${post.favoriteCount || 0})
                    </div>
                    <div class="action-btn" onclick="showReportModal('POST', ${post.id})">
                        🚩 举报
                    </div>
                </div>
            </div>
            <div class="comments-section">
                <div class="section-title"><span class="emoji">💬</span> 评论区 (${comments.length})</div>
                ${state.user ? `
                    <div class="form-group mb-4">
                        <textarea class="form-textarea" id="commentInput" placeholder="说点什么吧..."></textarea>
                        <button class="btn btn-primary mt-2" onclick="submitComment(${post.id})">发表评论</button>
                    </div>
                ` : `
                    <div class="empty-state" style="padding:20px;">
                        <div class="text"><a onclick="location.hash = '#/login'">登录</a> 后参与评论</div>
                    </div>
                `}
                <div id="commentsList">${commentsHtml}</div>
            </div>
        `;
    }

        const input = document.getElementById('commentInput');

        if (!content) {
            showNotification('评论内容不能为空', 'warning');

        const res = await API.post('/api/comments', { content, postId, parentId: null });

            renderPost(postId);
        } else {
            showNotification(res.message || '评论失败', 'error');
        }
    }
