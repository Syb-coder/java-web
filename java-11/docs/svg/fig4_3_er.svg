<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="960" viewBox="0 0 1620 960" role="img" aria-label="数据库 ER 图">
  <title>数据库 ER 图</title>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2,2 L10,6 L2,10 Z" fill="#4b5563"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 32px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #64748b; }
      .label { font: 700 18px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 14px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #475569; }
      .tiny { font: 500 12px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #64748b; }
      .white { fill: #ffffff; }
      .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; filter: url(#card-shadow); }
      .primary { fill: #2563eb; stroke: #1d4ed8; }
      .green { fill: #16a34a; stroke: #15803d; }
      .orange { fill: #f97316; stroke: #ea580c; }
      .purple { fill: #7c3aed; stroke: #6d28d9; }
      .pink { fill: #db2777; stroke: #be185d; }
      .dark { fill: #1f2937; stroke: #111827; }
      .line { fill: none; stroke: #4b5563; stroke-width: 2.4; marker-end: url(#arrow); }
      .line-blue { fill: none; stroke: #2563eb; stroke-width: 2.6; marker-end: url(#arrow-blue); }
      .line-soft { fill: none; stroke: #94a3b8; stroke-width: 2; marker-end: url(#arrow); }
      .relation { fill: none; stroke: #64748b; stroke-width: 2.1; }
      .dash { stroke-dasharray: 8 8; }
      .section-title { font: 700 20px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #334155; }
      .mono { font: 600 13px Consolas, "Microsoft YaHei", monospace; fill: #475569; }
    </style>
  </defs>
  <rect class="bg" width="1620" height="960"/>
  
  
  <text x="60" y="56" class="title">图 4-3 数据库 ER 图</text>
  <text x="60" y="84" class="subtitle">实体按业务域分区，关系线只走空白通道，不穿过表字段</text>
  
  <rect x="70" y="150" width="210" height="162" rx="14" class="primary"/>
  <text x="175" y="184" text-anchor="middle" class="label white">User 用户</text>
  <line x1="86" y1="202" x2="264" y2="202" stroke="#ffffff" stroke-opacity="0.8"/>
  <text x="88" y="228" class="mono">PK id</text>
<text x="88" y="252" class="mono">username</text>
<text x="88" y="276" class="mono">email</text>
<text x="88" y="300" class="mono">status</text>

  <rect x="390" y="150" width="210" height="162" rx="14" class="purple"/>
  <text x="495" y="184" text-anchor="middle" class="label white">Post 帖子</text>
  <line x1="406" y1="202" x2="584" y2="202" stroke="#ffffff" stroke-opacity="0.8"/>
  <text x="408" y="228" class="mono">PK id</text>
<text x="408" y="252" class="mono">FK user_id</text>
<text x="408" y="276" class="mono">FK section_id</text>
<text x="408" y="300" class="mono">status</text>

  <rect x="710" y="150" width="210" height="138" rx="14" class="node"/>
  <text x="815" y="184" text-anchor="middle" class="label">Section 分区</text>
  <line x1="726" y1="202" x2="904" y2="202" stroke="#cbd5e1" stroke-opacity="0.8"/>
  <text x="728" y="228" class="mono">PK id</text>
<text x="728" y="252" class="mono">name</text>
<text x="728" y="276" class="mono">sort_order</text>

  <rect x="1030" y="150" width="210" height="138" rx="14" class="node"/>
  <text x="1135" y="184" text-anchor="middle" class="label">PostTag 帖子标签</text>
  <line x1="1046" y1="202" x2="1224" y2="202" stroke="#cbd5e1" stroke-opacity="0.8"/>
  <text x="1048" y="228" class="mono">PK id</text>
<text x="1048" y="252" class="mono">FK post_id</text>
<text x="1048" y="276" class="mono">FK tag_id</text>

  <rect x="1350" y="150" width="210" height="138" rx="14" class="node"/>
  <text x="1455" y="184" text-anchor="middle" class="label">Tag 标签</text>
  <line x1="1366" y1="202" x2="1544" y2="202" stroke="#cbd5e1" stroke-opacity="0.8"/>
  <text x="1368" y="228" class="mono">PK id</text>
<text x="1368" y="252" class="mono">name</text>
<text x="1368" y="276" class="mono">usage_count</text>

  <rect x="70" y="405" width="210" height="162" rx="14" class="node"/>
  <text x="175" y="439" text-anchor="middle" class="label">Comment 评论</text>
  <line x1="86" y1="457" x2="264" y2="457" stroke="#cbd5e1" stroke-opacity="0.8"/>
  <text x="88" y="483" class="mono">PK id</text>
<text x="88" y="507" class="mono">FK user_id</text>
<text x="88" y="531" class="mono">FK post_id</text>
<text x="88" y="555" class="mono">content</text>

  <rect x="390" y="405" width="210" height="138" rx="14" class="node"/>
  <text x="495" y="439" text-anchor="middle" class="label">Favorite 收藏</text>
  <line x1="406" y1="457" x2="584" y2="457" stroke="#cbd5e1" stroke-opacity="0.8"/>
  <text x="408" y="483" class="mono">PK id</text>
<text x="408" y="507" class="mono">FK user_id</text>
<text x="408" y="531" class="mono">FK post_id</text>

  <rect x="710" y="405" width="210" height="162" rx="14" class="node"/>
  <text x="815" y="439" text-anchor="middle" class="label">Work 作品</text>
  <line x1="726" y1="457" x2="904" y2="457" stroke="#cbd5e1" stroke-opacity="0.8"/>
  <text x="728" y="483" class="mono">PK id</text>
<text x="728" y="507" class="mono">FK user_id</text>
<text x="728" y="531" class="mono">title</text>
<text x="728" y="555" class="mono">work_type</text>

  <rect x="1030" y="405" width="210" height="162" rx="14" class="node"/>
  <text x="1135" y="439" text-anchor="middle" class="label">Notification 通知</text>
  <line x1="1046" y1="457" x2="1224" y2="457" stroke="#cbd5e1" stroke-opacity="0.8"/>
  <text x="1048" y="483" class="mono">PK id</text>
<text x="1048" y="507" class="mono">FK user_id</text>
<text x="1048" y="531" class="mono">type</text>
<text x="1048" y="555" class="mono">read_flag</text>

  <rect x="1350" y="405" width="210" height="162" rx="14" class="orange"/>
  <text x="1455" y="439" text-anchor="middle" class="label white">Report 举报</text>
  <line x1="1366" y1="457" x2="1544" y2="457" stroke="#ffffff" stroke-opacity="0.8"/>
  <text x="1368" y="483" class="mono">PK id</text>
<text x="1368" y="507" class="mono">FK reporter_id</text>
<text x="1368" y="531" class="mono">target_type</text>
<text x="1368" y="555" class="mono">status</text>

  <rect x="70" y="660" width="210" height="138" rx="14" class="node"/>
  <text x="175" y="694" text-anchor="middle" class="label">Follow 关注</text>
  <line x1="86" y1="712" x2="264" y2="712" stroke="#cbd5e1" stroke-opacity="0.8"/>
  <text x="88" y="738" class="mono">PK id</text>
<text x="88" y="762" class="mono">FK follower_id</text>
<text x="88" y="786" class="mono">FK followee_id</text>

  <rect x="390" y="660" width="210" height="138" rx="14" class="node"/>
  <text x="495" y="694" text-anchor="middle" class="label">News 资讯</text>
  <line x1="406" y1="712" x2="584" y2="712" stroke="#cbd5e1" stroke-opacity="0.8"/>
  <text x="408" y="738" class="mono">PK id</text>
<text x="408" y="762" class="mono">title</text>
<text x="408" y="786" class="mono">category</text>

  <rect x="710" y="660" width="210" height="138" rx="14" class="dark"/>
  <text x="815" y="694" text-anchor="middle" class="label white">AdminUser 管理员</text>
  <line x1="726" y1="712" x2="904" y2="712" stroke="#ffffff" stroke-opacity="0.8"/>
  <text x="728" y="738" class="mono">PK id</text>
<text x="728" y="762" class="mono">username</text>
<text x="728" y="786" class="mono">role</text>

  <rect x="1030" y="660" width="210" height="138" rx="14" class="node"/>
  <text x="1135" y="694" text-anchor="middle" class="label">OperationLog 操作日志</text>
  <line x1="1046" y1="712" x2="1224" y2="712" stroke="#cbd5e1" stroke-opacity="0.8"/>
  <text x="1048" y="738" class="mono">PK id</text>
<text x="1048" y="762" class="mono">FK admin_id</text>
<text x="1048" y="786" class="mono">operation</text>

  <rect x="1350" y="660" width="210" height="138" rx="14" class="node"/>
  <text x="1455" y="694" text-anchor="middle" class="label">SensitiveWord 敏感词</text>
  <line x1="1366" y1="712" x2="1544" y2="712" stroke="#cbd5e1" stroke-opacity="0.8"/>
  <text x="1368" y="738" class="mono">PK id</text>
<text x="1368" y="762" class="mono">word</text>
<text x="1368" y="786" class="mono">enabled</text>
  
  <path d="M 280 200 L 390 200" class="relation"/>
  <text x="335" y="192" text-anchor="middle" class="tiny">1:N 发布</text>
  
  <path d="M 600 200 L 710 200" class="relation"/>
  <text x="655" y="192" text-anchor="middle" class="tiny">N:1 所属分区</text>
  
  <path d="M 600 260 L 1030 260" class="relation"/>
  <text x="815" y="252" text-anchor="middle" class="tiny">1:N 标签映射</text>
  
  <path d="M 1240 200 L 1350 200" class="relation"/>
  <text x="1295" y="192" text-anchor="middle" class="tiny">N:1 标签</text>
  
  <path d="M 175 298 L 175 405" class="relation"/>
  <text x="175" y="343.5" text-anchor="middle" class="tiny">1:N 编写评论</text>
  <path d="M 495 298 L 495 350 L 175 350 L 175 405" class="relation"/>
  <text x="350" y="342" text-anchor="middle" class="tiny">1:N 帖子评论</text>
  
  <path d="M 280 455 L 390 455" class="relation"/>
  <text x="335" y="447" text-anchor="middle" class="tiny">1:N 收藏</text>
  <path d="M 495 405 L 495 352 L 560 352 L 560 298" class="relation"/>
  <text x="585" y="360" text-anchor="start" class="tiny">N:1 指向帖子</text>
  <path d="M 280 245 L 315 245 L 315 515 L 710 515" class="relation"/>
  <text x="505" y="506" text-anchor="middle" class="tiny">1:N 创作作品</text>
  <path d="M 280 220 L 330 220 L 330 96 L 1135 96 L 1135 150" class="relation dash"/>
  <text x="730" y="88" text-anchor="middle" class="tiny">帖子与标签通过 PostTag 解耦</text>
  <path d="M 280 265 L 345 265 L 345 610 L 175 610 L 175 660" class="relation"/>
  <text x="308" y="602" text-anchor="middle" class="tiny">用户关注用户</text>
  <path d="M 1140 405 L 1140 350 L 175 350 L 175 298" class="relation dash"/>
  <text x="820" y="338" text-anchor="middle" class="tiny">通知归属用户</text>
  <path d="M 1455 405 L 1455 350 L 1140 350 L 1140 405" class="relation dash"/>
  <text x="1300" y="340" text-anchor="middle" class="tiny">举报触发通知</text>
  <path d="M 815 660 L 815 610 L 1135 610 L 1135 660" class="relation"/>
  <text x="978" y="602" text-anchor="middle" class="tiny">管理员写入日志</text>
  <path d="M 1455 660 L 1455 610 L 1455 553" class="relation dash"/>
  <text x="1472" y="606" text-anchor="start" class="tiny">内容审核引用</text>
  <rect x="70" y="830" width="1488" height="82" rx="18" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="95" y="862" class="section-title">关系说明</text>
  <text x="245" y="862" class="small" text-anchor="start">User 是社区行为主体；Post 归属 Section，并通过 PostTag 与 Tag 建立多对多关系。</text>
  <text x="245" y="892" class="small" text-anchor="start">Comment、Favorite、Follow、Notification、Report 围绕用户与帖子展开；AdminUser 负责治理并记录 OperationLog。</text>
  
</svg>