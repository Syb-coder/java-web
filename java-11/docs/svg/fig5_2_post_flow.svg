<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="880" viewBox="0 0 1360 880" role="img" aria-label="帖子发布流程图">
  <title>帖子发布流程图</title>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2,2 L10,6 L2,10 Z" fill="#4b5563"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 32px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #64748b; }
      .label { font: 700 18px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 14px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #475569; }
      .tiny { font: 500 12px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #64748b; }
      .white { fill: #ffffff; }
      .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; filter: url(#card-shadow); }
      .primary { fill: #2563eb; stroke: #1d4ed8; }
      .green { fill: #16a34a; stroke: #15803d; }
      .orange { fill: #f97316; stroke: #ea580c; }
      .purple { fill: #7c3aed; stroke: #6d28d9; }
      .pink { fill: #db2777; stroke: #be185d; }
      .dark { fill: #1f2937; stroke: #111827; }
      .line { fill: none; stroke: #4b5563; stroke-width: 2.4; marker-end: url(#arrow); }
      .line-blue { fill: none; stroke: #2563eb; stroke-width: 2.6; marker-end: url(#arrow-blue); }
      .line-soft { fill: none; stroke: #94a3b8; stroke-width: 2; marker-end: url(#arrow); }
      .relation { fill: none; stroke: #64748b; stroke-width: 2.1; }
      .dash { stroke-dasharray: 8 8; }
      .section-title { font: 700 20px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #334155; }
      .mono { font: 600 13px Consolas, "Microsoft YaHei", monospace; fill: #475569; }
    </style>
  </defs>
  <rect class="bg" width="1360" height="880"/>
  
  
  <text x="60" y="56" class="title">图 5-2 帖子发布流程图</text>
  <text x="60" y="84" class="subtitle">横向主流程加垂直异常分支，避免回路线压住文字</text>
  
  <rect x="60" y="180" width="210" height="84" rx="18" class="primary"/>
  <text x="165" y="214" text-anchor="middle" class="label white">开始</text>
  <text x="165" y="236" text-anchor="middle" class="white">进入发帖页面</text>
  
  <rect x="350" y="180" width="250" height="84" rx="18" class="node"/>
  <text x="475" y="214" text-anchor="middle" class="label">填写帖子内容</text>
  <text x="475" y="236" text-anchor="middle" class="small">标题 / 分区 / 正文 / 标签</text>
  
  <polygon points="760,162 875,222 760,282 645,222" class="node"/>
  <text x="760" y="214" text-anchor="middle" class="label">内容完整？</text>
  
  <rect x="1030" y="95" width="250" height="84" rx="18" class="orange"/>
  <text x="1155" y="129" text-anchor="middle" class="label white">返回表单错误</text>
  <text x="1155" y="151" text-anchor="middle" class="white">提示缺失字段</text>
  
  <rect x="640" y="390" width="250" height="84" rx="18" class="node"/>
  <text x="765" y="424" text-anchor="middle" class="label">敏感词检查</text>
  <text x="765" y="446" text-anchor="middle" class="small">过滤违规内容</text>
  
  <polygon points="760,547 880,612 760,677 640,612" class="node"/>
  <text x="760" y="604" text-anchor="middle" class="label">审核通过？</text>
  
  <rect x="1030" y="570" width="250" height="84" rx="18" class="orange"/>
  <text x="1155" y="604" text-anchor="middle" class="label white">保存为待处理</text>
  <text x="1155" y="626" text-anchor="middle" class="white">返回审核提示</text>
  
  <rect x="350" y="570" width="250" height="84" rx="18" class="green"/>
  <text x="475" y="604" text-anchor="middle" class="label white">保存帖子</text>
  <text x="475" y="626" text-anchor="middle" class="white">写入 Post / PostTag</text>
  
  <rect x="60" y="570" width="210" height="84" rx="18" class="primary"/>
  <text x="165" y="604" text-anchor="middle" class="label white">发布成功</text>
  <text x="165" y="626" text-anchor="middle" class="white">刷新列表与详情</text>
  
  <rect x="350" y="720" width="250" height="84" rx="18" class="purple"/>
  <text x="475" y="754" text-anchor="middle" class="label white">生成通知</text>
  <text x="475" y="776" text-anchor="middle" class="white">关注者 / 互动消息</text>
  
  <rect x="60" y="720" width="210" height="84" rx="18" class="dark"/>
  <text x="165" y="754" text-anchor="middle" class="label white">流程结束</text>
  <text x="165" y="776" text-anchor="middle" class="white">用户可继续浏览</text>
  <path d="M 270 222 L 350 222" class="line-blue"/>
  <path d="M 600 222 L 645 222" class="line-blue"/>
  <path d="M 875 222 L 980 222 L 980 137 L 1030 137" class="line"/>
  <path d="M 760 282 L 760 390" class="line-blue"/>
  <path d="M 760 474 L 760 547" class="line-blue"/>
  <path d="M 880 612 L 1030 612" class="line"/>
  <path d="M 640 612 L 600 612" class="line-blue"/>
  <path d="M 350 612 L 270 612" class="line-blue"/>
  <path d="M 475 654 L 475 720" class="line-blue"/>
  <path d="M 350 762 L 270 762" class="line-blue"/>
  <text x="960" y="205" text-anchor="middle" class="tiny">否</text>
  <text x="780" y="350" text-anchor="middle" class="tiny">是</text>
  <text x="970" y="596" text-anchor="middle" class="tiny">否</text>
  <text x="620" y="596" text-anchor="middle" class="tiny">是</text>
  
</svg>