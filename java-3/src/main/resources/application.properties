# 应用名称：用于 Spring Boot 启动日志、Actuator 端点等场景的标识
spring.application.name=java-3

# ===== H2 数据库配置（文件模式，持久化） =====
# 数据落盘到 java-3/data/ 目录，重启不丢数据
# DB_CLOSE_DELAY=-1：JVM 退出时不立即关闭数据库连接，避免开发期频繁启停导致锁文件残留
# MODE=MySQL：H2 启用 MySQL 兼容模式，使 SQL 语法更贴近生产环境
spring.datasource.url=jdbc:h2:file:./data/campusdb;DB_CLOSE_DELAY=-1;MODE=MySQL
# H2 JDBC 驱动类名（Spring Boot 4 中需显式指定）
spring.datasource.driver-class-name=org.h2.Driver
# H2 默认管理员账号（开发环境，生产环境应替换）
spring.datasource.username=sa
# H2 默认空密码
spring.datasource.password=

# ===== JPA / Hibernate =====
# 数据库方言：告知 Hibernate 生成何种 SQL 方言（H2 专用）
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# DDL 策略：update 表示启动时根据实体类自动建表/补字段，已有表结构不会被破坏
spring.jpa.hibernate.ddl-auto=update
# 控制台打印生成的 SQL，便于开发调试
spring.jpa.show-sql=true

# ===== H2 Web 控制台 =====
# 启用 H2 自带的 Web 控制台，便于在浏览器查看数据
spring.h2.console.enabled=true
# 控制台访问路径
spring.h2.console.path=/h2-console

# ===== 服务端口（8083 未被占用） =====
server.port=8083
