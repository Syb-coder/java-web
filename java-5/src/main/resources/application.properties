# ================================================================
# java-5 应用配置文件
# 职责：配置应用名称、数据库、JPA、H2 控制台、服务端口
# ================================================================

# ===== 应用名称 =====
# 用于 Spring 应用上下文标识，日志和监控中会体现
spring.application.name=java-5

# ===== H2 数据库配置（文件模式，持久化） =====
# 数据落盘到 java-5/data/ 目录，重启不丢数据
# url 参数说明：
#   file:./data/jobdb  → 数据库文件相对路径（项目根目录下 data/jobdb.mv.db）
#   DB_CLOSE_DELAY=-1  → JVM 退出前保持连接不关闭，避免连接池报错
#   MODE=MySQL         → 兼容 MySQL SQL 方言，便于后续迁移到 MySQL
spring.datasource.url=jdbc:h2:file:./data/jobdb;DB_CLOSE_DELAY=-1;MODE=MySQL
# JDBC 驱动类名，H2 数据库固定为 org.h2.Driver
spring.datasource.driver-class-name=org.h2.Driver
# 数据库用户名，H2 默认 sa（System Administrator）
spring.datasource.username=sa
# 数据库密码，H2 默认空密码（开发环境，生产环境必须设置）
spring.datasource.password=

# ===== JPA / Hibernate =====
# Hibernate 方言：指定使用 H2 数据库方言，生成兼容 H2 的 SQL
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# DDL 策略：update 表示启动时自动更新表结构（新增字段会自动加列，不删已有列）
# 为什么不用 create-drop：那会每次启动清空数据，违背持久化需求
spring.jpa.hibernate.ddl-auto=update
# 是否打印 SQL：开发期 true 便于调试，生产期应改为 false 减少日志量
spring.jpa.show-sql=true

# ===== H2 Web 控制台 =====
# 启用 H2 内置 Web 控制台，便于在浏览器查看数据
spring.h2.console.enabled=true
# 控制台访问路径，完整 URL：http://localhost:8084/h2-console
spring.h2.console.path=/h2-console

# ===== 服务端口 =====
# 应用监听端口，4 个子项目分别用 8080-8084，java-5 用 8084
server.port=8084
