<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="734" viewBox="0 0 1320 734" role="img" aria-label="图 4-6 用户登录时序图">
  <title>图 4-6 用户登录时序图</title>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 32px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #64748b; }
      .label { font: 700 18px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #0f172a; }
      .entity-label { font: 700 15px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 14px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #475569; }
      .tiny { font: 500 12px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #64748b; }
      .mono { font: 600 13px Consolas, "Microsoft YaHei", monospace; fill: #475569; }
      .white { fill: #ffffff; }
      .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; filter: url(#shadow); }
      .blue { fill: #2563eb; stroke: #1d4ed8; }
      .green { fill: #16a34a; stroke: #15803d; }
      .orange { fill: #f97316; stroke: #ea580c; }
      .purple { fill: #7c3aed; stroke: #6d28d9; }
      .pink { fill: #db2777; stroke: #be185d; }
      .dark { fill: #1f2937; stroke: #111827; }
      .line { fill: none; stroke: #475569; stroke-width: 2.4; marker-end: url(#arrow); }
      .line-blue { fill: none; stroke: #2563eb; stroke-width: 2.6; marker-end: url(#arrow-blue); }
      .relation { fill: none; stroke: #64748b; stroke-width: 2.1; }
      .dash { stroke-dasharray: 8 8; }
      .note { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 2; }
    </style>
  </defs>
  <rect class="bg" width="1320" height="734"/>
  
  
  <text x="60" y="56" class="title">图 4-6 用户登录时序图</text>
  <text x="60" y="84" class="subtitle">采用时序图布局，纵向消息不重叠，箭头方向与调用方一致</text>
  
  <rect x="25" y="120" width="190" height="72" rx="16" class="blue"/>
  <text x="120" y="154" text-anchor="middle" class="label white">读者</text>
  

  <rect x="285" y="120" width="190" height="72" rx="16" class="node"/>
  <text x="380" y="154" text-anchor="middle" class="label">前端页面</text>
  

  <rect x="555" y="120" width="190" height="72" rx="16" class="node"/>
  <text x="650" y="154" text-anchor="middle" class="label">AuthController</text>
  

  <rect x="825" y="120" width="190" height="72" rx="16" class="node"/>
  <text x="920" y="154" text-anchor="middle" class="label">ReaderService</text>
  

  <rect x="1095" y="120" width="190" height="72" rx="16" class="dark"/>
  <text x="1190" y="154" text-anchor="middle" class="label white">数据库</text>
  
  <path d="M 120 192 L 120 674" class="relation dash"/>
<path d="M 380 192 L 380 674" class="relation dash"/>
<path d="M 650 192 L 650 674" class="relation dash"/>
<path d="M 920 192 L 920 674" class="relation dash"/>
<path d="M 1190 192 L 1190 674" class="relation dash"/>
  
      <path d="M 120 245 L 380 245" class="line-blue"/>
      <text x="250" y="235" text-anchor="middle" class="small">输入账号密码</text>

      <path d="M 380 313 L 650 313" class="line"/>
      <text x="515" y="303" text-anchor="middle" class="small">提交登录请求</text>

      <path d="M 650 381 L 920 381" class="line"/>
      <text x="785" y="371" text-anchor="middle" class="small">校验读者身份</text>

      <path d="M 920 449 L 1190 449" class="line"/>
      <text x="1055" y="439" text-anchor="middle" class="small">查询读者记录</text>

      <path d="M 1190 517 L 920 517" class="line"/>
      <text x="1055" y="507" text-anchor="middle" class="small">返回账号状态</text>

      <path d="M 920 585 L 650 585" class="line"/>
      <text x="785" y="575" text-anchor="middle" class="small">生成会话信息</text>

      <path d="M 650 653 L 380 653" class="line"/>
      <text x="515" y="643" text-anchor="middle" class="small">返回登录结果</text>

      <path d="M 380 721 L 120 721" class="line-blue"/>
      <text x="250" y="711" text-anchor="middle" class="small">进入图书列表</text>
  
</svg>