<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="700" viewBox="0 0 1260 700" role="img" aria-label="图 4-2 功能模块设计图">
  <title>图 4-2 功能模块设计图</title>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 32px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #64748b; }
      .label { font: 700 18px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #0f172a; }
      .entity-label { font: 700 15px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 14px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #475569; }
      .tiny { font: 500 12px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #64748b; }
      .mono { font: 600 13px Consolas, "Microsoft YaHei", monospace; fill: #475569; }
      .white { fill: #ffffff; }
      .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; filter: url(#shadow); }
      .blue { fill: #2563eb; stroke: #1d4ed8; }
      .green { fill: #16a34a; stroke: #15803d; }
      .orange { fill: #f97316; stroke: #ea580c; }
      .purple { fill: #7c3aed; stroke: #6d28d9; }
      .pink { fill: #db2777; stroke: #be185d; }
      .dark { fill: #1f2937; stroke: #111827; }
      .line { fill: none; stroke: #475569; stroke-width: 2.4; marker-end: url(#arrow); }
      .line-blue { fill: none; stroke: #2563eb; stroke-width: 2.6; marker-end: url(#arrow-blue); }
      .relation { fill: none; stroke: #64748b; stroke-width: 2.1; }
      .dash { stroke-dasharray: 8 8; }
      .note { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 2; }
    </style>
  </defs>
  <rect class="bg" width="1260" height="700"/>
  
  
  <text x="60" y="56" class="title">图 4-2 功能模块设计图</text>
  <text x="60" y="84" class="subtitle">中心系统固定，功能模块分列排布，线条只连接模块边缘</text>
  
  <rect x="480" y="300" width="300" height="116" rx="16" class="dark"/>
  <text x="630" y="334" text-anchor="middle" class="label white">图书借阅管理系统</text>
  <text x="630" y="356" text-anchor="middle" class="white">图书管理、借阅流转</text>
<text x="630" y="380" text-anchor="middle" class="white">读者服务与后台治理</text>
  
  <rect x="80" y="140" width="270" height="100" rx="16" class="blue"/>
  <text x="215" y="174" text-anchor="middle" class="label white">读者认证模块</text>
  <text x="215" y="196" text-anchor="middle" class="white">登录 / 注册 / 类型管理</text>

  <rect x="80" y="300" width="270" height="100" rx="16" class="purple"/>
  <text x="215" y="334" text-anchor="middle" class="label white">图书管理模块</text>
  <text x="215" y="356" text-anchor="middle" class="white">图书 / 分类 / 库存</text>

  <rect x="80" y="460" width="270" height="100" rx="16" class="pink"/>
  <text x="215" y="494" text-anchor="middle" class="label white">借阅管理模块</text>
  <text x="215" y="516" text-anchor="middle" class="white">借书 / 还书 / 续借</text>
  
  <rect x="910" y="140" width="270" height="100" rx="16" class="green"/>
  <text x="1045" y="174" text-anchor="middle" class="label white">购物车模块</text>
  <text x="1045" y="196" text-anchor="middle" class="white">暂存 / 批量借阅</text>

  <rect x="910" y="300" width="270" height="100" rx="16" class="orange"/>
  <text x="1045" y="334" text-anchor="middle" class="label white">状态跟踪模块</text>
  <text x="1045" y="356" text-anchor="middle" class="white">借阅状态 / 逾期</text>

  <rect x="910" y="460" width="270" height="100" rx="16" class="dark"/>
  <text x="1045" y="494" text-anchor="middle" class="label white">后台管理模块</text>
  <text x="1045" y="516" text-anchor="middle" class="white">图书维护 / 读者管理</text>
  <path d="M 350 190 L 430 190 L 430 328 L 480 328" class="line"/>
  <path d="M 350 350 L 480 350" class="line"/>
  <path d="M 350 510 L 430 510 L 430 388 L 480 388" class="line"/>
  <path d="M 910 190 L 830 190 L 830 328 L 780 328" class="line"/>
  <path d="M 910 350 L 780 350" class="line"/>
  <path d="M 910 510 L 830 510 L 830 388 L 780 388" class="line"/>
  <text x="630" y="620" text-anchor="middle" class="subtitle">各模块通过 Service 与 Repository 协同，避免直接跨层访问。</text>
  
</svg>