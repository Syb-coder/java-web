<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>记忆翻牌游戏</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh; padding: 20px; color: #eee;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 {
            text-align: center; font-size: 2.2rem; margin-bottom: 6px;
            background: linear-gradient(90deg, #00f2fe, #4facfe);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .subtitle { text-align: center; color: #888; margin-bottom: 24px; font-size: 14px; }

        /* 难度选择 */
        .difficulty-bar {
            display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .diff-btn {
            padding: 10px 24px; border-radius: 24px; cursor: pointer; font-size: 14px;
            font-weight: 600; background: rgba(255,255,255,0.08); color: #ccc;
            border: 1px solid rgba(255,255,255,0.15); transition: all .2s;
        }
        .diff-btn:hover { background: rgba(255,255,255,0.15); }
        .diff-btn.active {
            background: linear-gradient(135deg, #4facfe, #00f2fe); color: #fff; border-color: transparent;
        }

        /* 状态栏 */
        .status-bar {
            display: flex; gap: 20px; justify-content: center; flex-wrap: wrap;
            margin-bottom: 20px; background: rgba(255,255,255,0.05);
            padding: 14px 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
        }
        .status-item { text-align: center; }
        .status-item .num { font-size: 22px; font-weight: 700; color: #4facfe; }
        .status-item .label { font-size: 12px; color: #888; margin-top: 2px; }

        .name-input {
            padding: 8px 14px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px; color: #eee; font-size: 14px; outline: none; width: 160px;
        }
        .name-input:focus { border-color: #4facfe; }

        /* 游戏面板 */
        .board-wrap { display: flex; justify-content: center; margin-bottom: 24px; }
        .board {
            display: grid; gap: 8px; padding: 16px;
            background: rgba(255,255,255,0.04); border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .card {
            width: 70px; height: 70px; border-radius: 10px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 32px; user-select: none; transition: all .25s;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: transparent; position: relative;
        }
        .card:hover:not(.flipped):not(.matched) { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(79,172,254,0.4); }
        .card.flipped, .card.matched {
            background: rgba(255,255,255,0.95); color: #24243e;
            transform: rotateY(0deg);
        }
        .card.matched { background: linear-gradient(135deg, #43e97b, #38f9d7); color: #fff; }
        .card.shake { animation: shake 0.4s; }
        @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }

        /* 完成弹窗 */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7);
            display: flex; align-items: center; justify-content: center; z-index: 100;
        }
        .modal {
            background: linear-gradient(135deg, #1a1a3e, #2d2d5e);
            border: 1px solid #4facfe; border-radius: 16px; padding: 36px;
            text-align: center; max-width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .modal h2 { color: #43e97b; font-size: 1.8rem; margin-bottom: 16px; }
        .modal .result { color: #4facfe; font-size: 16px; margin: 12px 0; line-height: 1.8; }
        .modal button {
            margin-top: 16px; padding: 10px 28px; border-radius: 24px; cursor: pointer;
            background: linear-gradient(135deg, #4facfe, #00f2fe); color: #fff;
            border: none; font-weight: 600; font-size: 14px;
        }
        .hidden { display: none; }

        /* 排行榜 */
        .leaderboard { margin-top: 30px; }
        .leaderboard h3 {
            color: #fff; font-size: 1.2rem; margin-bottom: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 10px;
        }
        .lb-table { width: 100%; border-collapse: collapse; }
        .lb-table th, .lb-table td {
            padding: 10px 12px; text-align: left; font-size: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .lb-table th { color: #4facfe; font-weight: 600; }
        .lb-table td { color: #ccc; }
        .lb-table tr.top1 td { color: #ffd700; font-weight: 700; }
        .lb-table tr.top2 td { color: #c0c0c0; }
        .lb-table tr.top3 td { color: #cd7f32; }
        .lb-table .rank { width: 50px; }
        .lb-table .time { color: #888; font-size: 12px; }
        .empty-row td { text-align: center; color: #666; padding: 24px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>记忆翻牌</h1>
        <p class="subtitle">翻开两张相同的牌即可消除 · 用最少步数和最短时间通关</p>

        <div class="difficulty-bar">
            <div class="diff-btn active" data-diff="EASY" onclick="selectDifficulty('EASY')">简单 4×4</div>
            <div class="diff-btn" data-diff="NORMAL" onclick="selectDifficulty('NORMAL')">普通 6×4</div>
            <div class="diff-btn" data-diff="HARD" onclick="selectDifficulty('HARD')">困难 6×6</div>
        </div>

        <div class="status-bar">
            <input type="text" class="name-input" id="player-name" placeholder="你的名字" maxlength="12">
            <div class="status-item"><div class="num" id="moves">0</div><div class="label">步数</div></div>
            <div class="status-item"><div class="num" id="timer">00:00</div><div class="label">用时</div></div>
            <div class="status-item"><div class="num" id="matched">0/0</div><div class="label">已配对</div></div>
        </div>

        <div class="board-wrap"><div class="board" id="board"></div></div>

        <!-- 完成弹窗 -->
        <div class="modal-overlay hidden" id="modal">
            <div class="modal">
                <h2>🎉 通关！</h2>
                <div class="result" id="result-text"></div>
                <button onclick="restart()">再来一局</button>
            </div>
        </div>

        <div class="leaderboard">
            <h3>🏆 排行榜（<span id="lb-diff-label">简单</span>）</h3>
            <table class="lb-table">
                <thead>
                    <tr><th class="rank">名次</th><th>玩家</th><th>步数</th><th>用时</th><th>时间</th></tr>
                </thead>
                <tbody id="lb-body"><tr class="empty-row"><td colspan="5">加载中...</td></tr></tbody>
            </table>
        </div>
    </div>

    <script>
        const API = '/api/games';
        const EMOJIS = ['🍎','🍌','🍇','🍒','🥝','🍑','🍍','🥥','🍓','🥑','🍊','🍋','🍉','🍐','🥭','🍅','🫐','🍈','🥬','🌽','🥕','🥦','🍄','🧅','🥔','🍆','🫑','🥒','🥜','🌰','🥚','🧀','🍞','🥐','🥖','🧇'];

        let currentDiff = 'EASY';
        let cols = 4, rows = 4, pairs = 8;
        let cards = [];
        let flipped = [];      // 当前翻开未配对的牌索引
        let matchedCount = 0;
        let moves = 0;
        let startTime = null;
        let timerInterval = null;
        let locked = false;    // 动画期间锁定

        function selectDifficulty(diff) {
            currentDiff = diff;
            document.querySelectorAll('.diff-btn').forEach(b => b.classList.toggle('active', b.dataset.diff === diff));
            const cfg = {EASY:[4,4], NORMAL:[6,4], HARD:[6,6]}[diff];
            cols = cfg[0]; rows = cfg[1]; pairs = (cols*rows)/2;
            const labels = {EASY:'简单', NORMAL:'普通', HARD:'困难'};
            document.getElementById('lb-diff-label').textContent = labels[diff];
            restart();
            loadLeaderboard();
        }

        function initBoard() {
            // 选取 pairs 个 emoji，每个出现两次，打乱
            const chosen = EMOJIS.slice(0, pairs);
            const deck = [...chosen, ...chosen]
                .map(e => ({e, r: Math.random()}))
                .sort((a,b) => a.r - b.r)
                .map(x => x.e);
            cards = deck;

            const board = document.getElementById('board');
            board.style.gridTemplateColumns = `repeat(${cols}, 70px)`;
            board.innerHTML = deck.map((e, i) => `<div class="card" data-idx="${i}" data-emoji="${e}" onclick="flipCard(${i})">?</div>`).join('');

            flipped = [];
            matchedCount = 0;
            moves = 0;
            locked = false;
            updateStatus();
        }

        function flipCard(i) {
            if (locked) return;
            const el = document.querySelector(`.card[data-idx="${i}"]`);
            if (el.classList.contains('flipped') || el.classList.contains('matched')) return;
            if (flipped.length >= 2) return;

            // 启动计时
            if (startTime === null) {
                startTime = Date.now();
                timerInterval = setInterval(updateTimer, 1000);
            }

            el.classList.add('flipped');
            el.textContent = cards[i];
            flipped.push(i);

            if (flipped.length === 2) {
                moves++;
                updateStatus();
                checkMatch();
            }
        }

        function checkMatch() {
            const [a, b] = flipped;
            const elA = document.querySelector(`.card[data-idx="${a}"]`);
            const elB = document.querySelector(`.card[data-idx="${b}"]`);
            locked = true;

            if (cards[a] === cards[b]) {
                // 配对成功
                setTimeout(() => {
                    elA.classList.add('matched');
                    elB.classList.add('matched');
                    matchedCount++;
                    flipped = [];
                    locked = false;
                    updateStatus();
                    if (matchedCount === pairs) {
                        finishGame();
                    }
                }, 300);
            } else {
                // 不匹配，翻回
                setTimeout(() => {
                    elA.classList.add('shake');
                    elB.classList.add('shake');
                    setTimeout(() => {
                        elA.classList.remove('flipped','shake');
                        elB.classList.remove('flipped','shake');
                        elA.textContent = '?';
                        elB.textContent = '?';
                        flipped = [];
                        locked = false;
                    }, 400);
                }, 700);
            }
        }

        function updateStatus() {
            document.getElementById('moves').textContent = moves;
            document.getElementById('matched').textContent = `${matchedCount}/${pairs}`;
        }

        function updateTimer() {
            const sec = Math.floor((Date.now() - startTime) / 1000);
            const m = String(Math.floor(sec/60)).padStart(2,'0');
            const s = String(sec%60).padStart(2,'0');
            document.getElementById('timer').textContent = `${m}:${s}`;
        }

        async function finishGame() {
            clearInterval(timerInterval);
            const durationSeconds = Math.floor((Date.now() - startTime) / 1000);
            const playerName = document.getElementById('player-name').value.trim() || '匿名玩家';

            // 提交成绩
            try {
                await fetch(API, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({playerName, difficulty: currentDiff, moves, durationSeconds})
                });
            } catch (e) {}

            // 展示弹窗
            const m = String(Math.floor(durationSeconds/60)).padStart(2,'0');
            const s = String(durationSeconds%60).padStart(2,'0');
            document.getElementById('result-text').innerHTML =
                `${escapeHtml(playerName)}<br>步数 <b>${moves}</b> 步 · 用时 <b>${m}:${s}</b>`;
            document.getElementById('modal').classList.remove('hidden');
            loadLeaderboard();
        }

        function restart() {
            document.getElementById('modal').classList.add('hidden');
            clearInterval(timerInterval);
            startTime = null;
            document.getElementById('timer').textContent = '00:00';
            initBoard();
        }

        async function loadLeaderboard() {
            try {
                const res = await fetch(`${API}/leaderboard/${currentDiff}`);
                const list = await res.json();
                const body = document.getElementById('lb-body');
                if (list.length === 0) {
                    body.innerHTML = '<tr class="empty-row"><td colspan="5">暂无记录，快来抢占榜首！</td></tr>';
                    return;
                }
                body.innerHTML = list.map((r, i) => {
                    const m = String(Math.floor(r.durationSeconds/60)).padStart(2,'0');
                    const s = String(r.durationSeconds%60).padStart(2,'0');
                    const rankClass = i < 3 ? `top${i+1}` : '';
                    return `<tr class="${rankClass}">
                        <td class="rank">${i+1}</td>
                        <td>${escapeHtml(r.playerName)}</td>
                        <td>${r.moves}</td>
                        <td>${m}:${s}</td>
                        <td class="time">${formatTime(r.completedAt)}</td>
                    </tr>`;
                }).join('');
            } catch (e) {}
        }

        function escapeHtml(s) {
            return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }
        function formatTime(s) {
            return s ? s.replace('T',' ').substring(0,16) : '';
        }

        selectDifficulty('EASY');
    </script>
</body>
</html>
